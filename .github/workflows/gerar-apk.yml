name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar a assinatura (chave guardada nos Secrets)
        env:
          CHAVE: ${{ secrets.FREEDOM_KEYSTORE }}
          SENHA: ${{ secrets.FREEDOM_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then
            echo "::error::Faltam os Secrets FREEDOM_KEYSTORE e FREEDOM_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions). Veja o LEIA-ME."
            exit 1
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/freedom.jks"
          echo "FREEDOM_KEYSTORE_FILE=$RUNNER_TEMP/freedom.jks" >> "$GITHUB_ENV"

      - name: Montar o APK
        env:
          FREEDOM_KEYSTORE_PASSWORD: ${{ secrets.FREEDOM_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Conferir a assinatura
        run: |
          rm -f "$RUNNER_TEMP/freedom.jks"
          # impressão digital da chave oficial do Freedom: se mudar, os celulares não aceitam a atualização
          ESPERADA="4ee15aa7978637266150d9de168c64a6896502ff900a8f83d0c565c8fd1f3e19"
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$AS" ]; then echo "::warning::apksigner não encontrado; assinatura não conferida"; exit 0; fi
          "$AS" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certificado.txt | grep -E "DN|SHA-256"
          if ! grep -qi "SHA-256 digest: $ESPERADA" certificado.txt; then
            echo "::error::O APK foi assinado com outra chave (Secrets trocados?). Não publiquei para não quebrar a atualização dos celulares."
            exit 1
          fi

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Freedom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Freedom
          path: Freedom.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Freedom 3.${{ github.run_number }}
          body: |
            Freedom.apk = app único: Helpdesk, site e painéis/widgets (Comercial, Faturamento) conforme o acesso de cada login
          files: Freedom.apk
          make_latest: true

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Montar o Freedom para Windows
        run: dotnet build windows/Freedom.Windows.csproj -c Release -p:Version=3.${{ github.run_number }}.0

      - name: Conferir e renomear
        shell: pwsh
        run: |
          $exe = "windows/bin/Release/net48/Freedom.exe"
          if (-not (Test-Path $exe)) { Write-Error "Freedom.exe não foi gerado"; exit 1 }
          $tam = (Get-Item $exe).Length
          Write-Host "Freedom.exe: $tam bytes"
          if ($tam -lt 800000) { Write-Error "Freedom.exe pequeno demais (faltou o WebView2 dentro)"; exit 1 }
          Copy-Item $exe Freedom-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Freedom-Windows
          path: Freedom-Windows.exe

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: Freedom-Windows.exe

  mac:
    needs: apk
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes (avisos, painéis, sem internet)
        run: |
          node mac/teste/engine.test.js
          node mac/teste/integracao.test.js

      - name: Montar o Freedom para Mac (Intel e Apple Silicon)
        working-directory: mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm version 3.${{ github.run_number }}.0 --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npm run build

      - name: Conferir
        run: |
          ls -la mac/dist
          test -f mac/dist/Freedom-Mac.dmg
          test -f mac/dist/Freedom-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Freedom-Mac
          path: |
            mac/dist/Freedom-Mac.dmg
            mac/dist/Freedom-Mac.zip

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            mac/dist/Freedom-Mac.dmg
            mac/dist/Freedom-Mac.zip
