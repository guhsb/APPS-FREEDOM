name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar o APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Freedom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Freedom
          path: Freedom.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Freedom ${{ github.run_number }}
          body: |
            Freedom.apk = app único: Helpdesk, site e painéis/widgets (Comercial, Faturamento) conforme o acesso de cada login
          files: Freedom.apk
          make_latest: true
