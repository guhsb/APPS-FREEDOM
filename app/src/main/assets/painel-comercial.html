<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="base.css">
<style>
.busca{display:flex;gap:8px;margin:4px 0 10px}
.busca input:focus{border-color:var(--rosa)}
.busca input{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:12px;color:var(--tx);font-size:15px;padding:11px 12px;outline:none}
.filtros{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.filtros button{flex:none;background:var(--sf);border:1px solid var(--ln);color:var(--tx2);border-radius:999px;padding:7px 12px;font-size:12px}
.filtros button.on{background:var(--rosa);border-color:var(--rosa);color:#fff;font-weight:700}
.vs h2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--tx2);margin:22px 2px 10px}
.vs h2 span{letter-spacing:0;font-weight:400;font-size:12px}
.v{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.v .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.v .l span{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v .l span em{font-style:normal;color:var(--tx3);font-size:12px;margin-right:6px}
.v .l b{white-space:nowrap}.v .l b i{font-style:normal;color:var(--tx3);font-size:12px;margin-left:6px}
.v .trilho{height:6px;margin:9px 0 6px}.v .trilho>s{top:-3px;bottom:-3px}
.v .d{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);gap:8px}
.nota{font-size:12px;color:var(--tx3);margin-top:10px}
.vazio{text-align:center;color:var(--tx3);padding:30px 0}
</style></head><body>
<div id="conteudo"></div>
<script>var PAINEL_ID = 'comercial';</script>
<script src="base.js"></script>
<script>
var filtro = 'todos', busca = '', dadosAtuais = null;

function hero(o, rotulo, sub, corOk, corRuim) {
  var cor = F.n(o.valor) >= F.n(o.ideal) ? corOk : corRuim;
  return '<div class="rot">' + rotulo + '</div>' +
    '<div class="big"><small>R$</small>' + F.num(o.valor) + '</div>' +
    '<span class="pill">' + F.pct(F.n(o.p) * 100) + ' da meta</span>' + (sub ? ' <span class="cinza" style="font-size:12px;margin-left:6px">' + sub + '</span>' : '') +
    F.barra(F.n(o.p), F.n(o.idealP), cor) +
    '<div class="leg"><span>0</span><span>ideal hoje ' + F.pct(F.n(o.idealP) * 100) + '</span><span>' + F.brlK(o.meta) + '</span></div>';
}

function gestor(d) {
  var h = '<div class="card">' + hero(d, 'FATURAMENTO DO MÊS' + (d.nome ? ' · ' + F.esc(d.nome).toUpperCase() : ''), '', '#4f7cff', '#e84b8a') +
    '<div class="tiles">' +
    F.tile('Meta', F.brlK(d.meta)) + F.tile('Ideal hoje', F.brlK(d.ideal)) + F.tile('Falta', F.brlK(d.falta), F.n(d.falta) > 0 ? 'laranja' : 'verde') +
    F.tile('Por dia (' + F.int(d.rest) + ' dias)', F.n(d.rest) > 0 ? F.brlK(d.porDia) : '—') +
    F.tile('Positivação', F.int(d.pos) + '/' + F.int(d.metaPos), 'verde') + F.tile('Dias úteis', F.int(d.dec) + '/' + F.int(d.T)) +
    (F.n(d.pedidos) ? F.tile('Pedidos', F.int(d.pedidos)) : '') + (F.n(d.ticket) ? F.tile('Ticket médio', F.brlK(d.ticket)) : '') +
    (F.n(d.projecao) ? F.tile('Projeção', F.brlK(d.projecao)) : '') +
    '</div></div>';
  var vs = d.vendedores || [];
  h += '<div class="vs"><h2>VENDEDORES <span>' + vs.length + ' no total</span></h2>' +
    '<div class="busca"><input id="busca" type="search" placeholder="Buscar vendedor" value="' + F.esc(busca) + '"></div>' +
    '<div class="filtros">' +
    [['todos', 'Todos'], ['abaixo', 'Abaixo do ideal'], ['bateram', 'Bateram a meta'], ['semmeta', 'Sem meta']].map(function (f) {
      return '<button data-f="' + f[0] + '" class="' + (filtro === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
    }).join('') + '</div><div id="lista"></div></div>';
  document.getElementById('conteudo').innerHTML = h;
  dadosAtuais = d;
  document.getElementById('busca').oninput = function () { busca = this.value; lista(); };
  Array.prototype.forEach.call(document.querySelectorAll('.filtros button'), function (b) {
    b.onclick = function () { filtro = b.dataset.f; Array.prototype.forEach.call(document.querySelectorAll('.filtros button'), function (x) { x.classList.toggle('on', x === b); }); lista(); };
  });
  lista();
}

function lista() {
  var d = dadosAtuais, idealP = F.n(d.idealP), q = busca.trim().toUpperCase();
  var vs = (d.vendedores || []).map(function (x, i) { x.rank = i + 1; return x; }).filter(function (x) {
    var vf = F.n(x.valor), vm = F.n(x.meta);
    if (q && String(x.nome).toUpperCase().indexOf(q) < 0) return false;
    if (filtro === 'abaixo') return vm > 0 && vf < vm * idealP;
    if (filtro === 'bateram') return vm > 0 && vf >= vm;
    if (filtro === 'semmeta') return !(vm > 0);
    return true;
  });
  document.getElementById('lista').innerHTML = vs.length ? vs.map(function (x) {
    var vf = F.n(x.valor), vm = F.n(x.meta), p = vm ? vf / vm : 0, id = vm * idealP, f = Math.max(0, vm - vf);
    var cor = !vm ? '#3a4154' : vf >= id ? '#4f7cff' : '#f0a53a';
    return '<div class="v"><div class="l"><span><em>' + x.rank + 'º</em>' + F.esc(x.nome) + '</span><b>' + F.brlK(vf) + (vm ? '<i>' + F.pct(p * 100) + '</i>' : '') + '</b></div>' +
      F.barra(p, vm ? idealP : null, cor) +
      (vm ? '<div class="d"><span>Meta ' + F.brlK(vm) + '</span><span>Ideal ' + F.brlK(id) + '</span><span>' + (f > 0 ? 'Falta ' + F.brlK(f) : '<b class="verde">meta batida</b>') + '</span></div>'
          : '<div class="d"><span>sem meta cadastrada</span>' + (F.n(x.pedidos) ? '<span>' + F.int(x.pedidos) + ' pedidos</span>' : '') + '</div>') + '</div>';
  }).join('') : '<div class="vazio">Nenhum vendedor neste filtro.</div>';
}

function vendedor(d) {
  var s = d.semana || {}, m = d.mes || {}, ac = F.n(s.acumulado);
  var nota = ac >= 0.01 ? 'A meta da semana inclui ' + F.brlK(ac) + ' que faltaram nas semanas anteriores.' :
             ac <= -0.01 ? 'Você vendeu ' + F.brlK(-ac) + ' a mais nas semanas anteriores: a meta desta semana ficou menor.' : '';
  var h = '<div class="card">' + hero(s, F.esc(s.titulo || 'SEMANA') + (d.nome ? ' · ' + F.esc(d.nome).toUpperCase() : ''), '', '#4f7cff', '#e84b8a') +
    '<div class="tiles">' +
    F.tile('Meta da semana', F.brlK(s.meta)) + F.tile('Ideal hoje', F.brlK(s.ideal)) + F.tile('Falta', F.brlK(s.falta), F.n(s.falta) > 0 ? 'laranja' : 'verde') +
    F.tile('Para bater', F.n(s.restam) > 0 ? F.brlK(s.porDia) + '/dia' : '—') + F.tile('Dias restantes', F.int(s.restam)) +
    F.tile('Positivação', F.int(s.pos) + '/' + F.int(s.metaPos), 'verde') +
    '</div>' + (nota ? '<div class="nota">' + nota + '</div>' : '') + '</div>';
  h += '<div class="card">' + hero(m, 'MÊS', 'dia útil ' + F.int(m.dec) + ' de ' + F.int(m.T), '#e84b8a', '#e84b8a') +
    '<div class="tiles">' +
    F.tile('Meta do mês', F.brlK(m.meta)) + F.tile('Ideal hoje', F.brlK(m.ideal)) + F.tile('Falta', F.brlK(m.falta), F.n(m.falta) > 0 ? 'laranja' : 'verde') +
    F.tile('Por dia (' + F.int(m.rest) + ' dias)', F.n(m.rest) > 0 ? F.brlK(m.porDia) : '—') + F.tile('Positivação', F.int(m.pos) + '/' + F.int(m.metaPos), 'verde') +
    F.tile('Dias úteis', F.int(m.dec) + '/' + F.int(m.T)) + '</div></div>';
  document.getElementById('conteudo').innerHTML = h;
}

Base.iniciar(function (d, e) {
  if (d.tipo === 'vendedor') vendedor(d); else gestor(d);
  document.getElementById('conteudo').insertAdjacentHTML('beforeend', '<div class="rod">Atualiza sozinho a cada 15 minutos · toque em ↻ para atualizar agora</div>');
});
</script>
</body></html>
