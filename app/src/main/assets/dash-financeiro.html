<html lang="pt-BR"><head><meta charset="utf-8">

<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="dash.css"><script>try{document.documentElement.setAttribute('data-tema',((window.App&&App.tema&&App.tema())||localStorage.getItem('tema'))==='escuro'?'escuro':'claro')}catch(e){document.documentElement.setAttribute('data-tema','claro')}</script>
<style>
.perfil{display:inline-flex;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--laranja-s);color:var(--tx-laranja);margin-left:6px;vertical-align:2px}

.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:620px){.dois{grid-template-columns:1fr}}
.pr .lb{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.pr .v{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.pr .s{font-size:12.5px;color:var(--tx3)}.pr .s b{color:var(--tx)}
.pr .barra{margin:12px 0 6px}
.tit{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.tit:first-child{border-top:0}
.tit .c{flex:1;min-width:0}.tit .c b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tit .c span{font-size:12px;color:var(--tx3)}
.tit .v{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}.tit .v small{display:block;font-weight:600;font-size:11.5px;color:var(--tx3)}
.sem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--ln)}.sem:first-child{border-top:0}
.sem b{font-size:13.5px}.sem .sv{text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.sem .bb{grid-column:1/-1;display:flex;gap:3px;height:8px}.sem .bb i{border-radius:99px;display:block}
.sem small{grid-column:1/-1;font-size:12px;color:var(--tx3)}
@media (min-width:700px){.pers{flex-wrap:wrap;overflow:visible}.filt label{max-width:220px}}

.pvr .dois{gap:10px}
.dia2{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin:14px 0 2px;display:flex;justify-content:space-between}
</style>

<script>
var versao = null, X = Dash, emp = X.lembrar('fin_emp') || '', pers = (function () { try { return JSON.parse(X.lembrar('fin_pers') || 'null'); } catch (e) { return null; } })() || null, aba = X.lembrar('fin_aba') || 'resumo', per = X.lembrar('fin_per') || 'mes', S = { resumo: null, rec: null, pag: null }, carregando = {};

  return [m[0], m[0].slice(0, 8) + ('0' + d).slice(-2), MESES[Number(m[0].slice(5, 7)) - 1] + (r[1] > h ? ' (até dia ' + d + ')' : '')];

/** As 4 semanas a partir de amanhã (previsto pelo vencimento). */

/** Títulos em aberto que vencem no período (até 1.000, mais perto primeiro). */

    [['Recebimentos', j.entries_forecast, j.entries_execution_percent, j.entries_missing, 'var(--verde)'], ['Pagamentos', j.exits_forecast, j.exits_execution_percent, j.exits_missing, 'var(--azul)']].map(function (x) {

    var melhor = uteis.slice().sort(function (a, b) { return n(b.entries) - n(a.entries); })[0], neg = uteis.filter(function (x) { return n(x.net) < 0; });
    ins.push(X.ins('verde', '▲', 'Maior recebimento: ' + X.dm(melhor.date), X.k(melhor.entries) + ' recebidos nesse dia'));
    if (neg.length) ins.push(X.ins('laranja', '▼', neg.length + (neg.length > 1 ? ' dias pagaram mais do que receberam' : ' dia pagou mais do que recebeu'), 'Pior: ' + X.dm(neg.sort(function (a, b) { return n(a.net) - n(b.net); })[0].date) + ' · ' + X.k(neg[0].net)));
  }
  if (n(j.entries_missing) > 0) ins.push(X.ins('azul', '◎', 'Ainda faltam ' + X.k(j.entries_missing) + ' para receber', 'Do previsto de ' + X.k(j.entries_forecast) + ' no período'));
  h += X.atencao(ins.slice(0, 4));
  h += '<div class="cs" style="margin:4px 2px 14px">Estimativa em homologação: o previsto usa o vencimento e o realizado a data de pagamento.</div>';
  return h;
}
function projecao(proj) {
  proj = (proj || []).filter(function (x) { return x.j && x.j.entries_forecast != null; }); if (!proj.length) return '';
  var mx = Math.max.apply(null, proj.map(function (x) { return Math.max(n(x.j.entries_forecast), n(x.j.exits_forecast)); }).concat([1])), te = 0, ts = 0;
  var corpo = proj.map(function (x) {
    var e = n(x.j.entries_forecast), sa = n(x.j.exits_forecast), sl = e - sa; te += e; ts += sa;
    return '<div class="sem"><b>' + X.dm(x.w[0]) + ' a ' + X.dm(x.w[1]) + '</b><span class="sv" style="color:var(--tx-' + (sl >= 0 ? 'verde' : 'rosa') + ')">' + (sl < 0 ? '−' : '+') + X.k(Math.abs(sl)) + '</span>' +
      '<div class="bb"><i style="width:' + (e / mx * 50) + '%;background:var(--verde)"></i><i style="width:' + (sa / mx * 50) + '%;background:var(--azul)"></i></div>' +
      '<small>entra ' + X.k(e) + ' · sai ' + X.k(sa) + '</small></div>';
  }).join('');
  var st = te - ts;
  return X.card('Próximos 30 dias', 'Previsto pelo vencimento dos títulos · ' + (st >= 0 ? 'sobra ' : 'falta ') + X.k(Math.abs(st)), corpo +
    '<div class="lg"><span><i style="border-color:var(--verde)"></i>Entra</span><span><i style="border-color:var(--azul)"></i>Sai</span></div>');
}
function previsto(t, real, prev, p, falta, cor, txtFalta) {
  return '<div class="card pr"><div class="lb">' + t + '</div><div class="v">' + X.k(real) + '</div><div class="s">de <b>' + X.k(prev) + '</b> previstos</div>' +
    '<div class="barra"><i style="width:' + Math.min(100, n(p)) + '%;background:var(--' + cor + ')"></i></div>' +
    '<div class="leg"><span><b style="color:var(--tx)">' + pct(p) + '</b> realizado</span><span>' + txtFalta + ' ' + X.k(falta) + '</span></div></div>';
}
function lista(l, rec) {
  if (!l.itens.length) return '<div class="vazio">Nenhum título em aberto vencendo nesse período.</div>';
  var tot = l.itens.reduce(function (a, x) { return a + x.v; }, 0), hoje = X.hoje(), h = '';
  var venc = l.itens.filter(function (x) { return x.venc < hoje; }), vv = venc.reduce(function (a, x) { return a + x.v; }, 0);
  var ncli = Object.keys(l.itens.reduce(function (m, x) { m[x.cod] = 1; return m; }, {})).length;
  h += X.k4([[rec ? 'A receber' : 'A pagar', X.k(tot), X.int(l.tot) + ' títulos · ' + ncli + (rec ? ' clientes' : ' fornecedores')], ['Já vencidos', venc.length ? X.k(vv) : '—', venc.length ? venc.length + ' títulos' : 'nenhum', venc.length ? 'neg' : '']]);
  var dias = {}, ord = [];
  l.itens.forEach(function (x) { if (!dias[x.venc]) { dias[x.venc] = []; ord.push(x.venc); } dias[x.venc].push(x); });
  var corpo = ord.map(function (d) {
    var it = dias[d].sort(function (a, b) { return b.v - a.v; }), s = it.reduce(function (a, x) { return a + x.v; }, 0);
    return '<div class="dia2"><span>' + (d === hoje ? 'Hoje' : X.dm(d)) + (d < hoje ? ' · vencido' : '') + '</span><span>' + X.k(s) + '</span></div>' + it.slice(0, 15).map(function (x) {
      return '<div class="tit"><div class="c"><b>' + F.esc(x.nome) + '</b><span>Doc ' + F.esc(x.doc) + (x.cod ? ' · cód. ' + F.esc(x.cod) : '') + (x.fone ? ' · ' + F.esc(x.fone) : '') + '</span></div><div class="v">' + F.brl(x.v) + '<small>empresa ' + F.esc(x.emp) + '</small></div></div>';
    }).join('') + (it.length > 15 ? '<div class="cs" style="margin:6px 0 0">+ ' + (it.length - 15) + ' títulos nesse dia</div>' : '');
  }).join('');
  h += X.card(rec ? 'Títulos a receber por vencimento' : 'Títulos a pagar por vencimento', l.tot > l.itens.length ? 'Mostrando os ' + l.itens.length + ' primeiros de ' + X.int(l.tot) : 'Maiores valores primeiro em cada dia', corpo);
  return h;
}

// ---------- imagem (PNG) ----------
function quando() { return new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function imagem() {
  var s = S[aba], p = periodo(per), nomeP = (PERS.filter(function (x) { return x[0] === per; })[0] || [0, ''])[1];
  if (!s || s.k !== chave(aba)) { F.toast('Espere os números carregarem'); return; }
  var sub = nomeP + (emp ? ' · Empresa ' + emp : '') + ' · ' + F.dataBR(p[0]) + (p[0] !== p[1] ? ' a ' + F.dataBR(p[1]) : '') + ' · ' + quando(), bl = [];
  if (aba === 'resumo') {
    var j = s.j;
    bl.push({ tipo: 'card', blocos: [{ tipo: 'hero', rot: 'Saldo do período', valor: n(j.net), pill: 'Entrou ' + X.k(j.entries), sub: 'saiu ' + X.k(j.exits) }] });
    bl.push({ tipo: 'tiles', cols: 2, itens: [{ r: 'Recebido · ' + pct(j.entries_execution_percent) + ' do previsto', v: X.k(j.entries), c: 'verde' }, { r: 'Pago · ' + pct(j.exits_execution_percent) + ' do previsto', v: X.k(j.exits), c: 'azul' },
      { r: 'Falta receber', v: X.k(j.entries_missing) }, { r: 'Falta pagar', v: X.k(j.exits_missing) }] });
    var pj = (s.proj || []).filter(function (x) { return x.j && x.j.entries_forecast != null; });
    if (pj.length) bl.push({ tipo: 'tabela', titulo: 'Próximos 30 dias (previsto)', cols: [['Semana', 'l', 0.3], ['Entra', 'r', 0.24], ['Sai', 'r', 0.22], ['Saldo', 'r', 0.24, 1]],
      linhas: pj.map(function (x) { var e = n(x.j.entries_forecast), sa = n(x.j.exits_forecast); return [X.dm(x.w[0]) + ' a ' + X.dm(x.w[1]), X.k(e), X.k(sa), (e - sa < 0 ? '−' : '') + X.k(Math.abs(e - sa))]; }) });
  } else {
    var l = s.l, tot = l.itens.reduce(function (a, x) { return a + x.v; }, 0);
    bl.push({ tipo: 'card', blocos: [{ tipo: 'hero', rot: aba === 'rec' ? 'A receber no período' : 'A pagar no período', valor: tot, pill: X.int(l.tot) + ' títulos em aberto' }] });
    bl.push({ tipo: 'tabela', titulo: 'Maiores títulos', cols: [['Vence', 'l', 0.14], [aba === 'rec' ? 'Cliente' : 'Fornecedor', 'l', 0.6], ['Valor', 'r', 0.26, 1]],
      linhas: l.itens.slice().sort(function (a, b) { return b.v - a.v; }).slice(0, 20).map(function (x) { return [X.dm(x.venc), x.nome, F.brl(x.v)]; }) });
  }
  bl.push({ tipo: 'nota', t: 'Dados em homologação no site.' });
  F.gerarImagem({ titulo: aba === 'resumo' ? 'Financeiro' : aba === 'rec' ? 'Contas a receber' : 'Contas a pagar', sub: sub, arquivo: 'Financeiro_' + X.hoje().replace(/-/g, ''), blocos: bl });
}

// ---------- toques ----------
document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-aba],[data-per]') : null; if (!t) return;
  if (t.hasAttribute('data-aba')) { aba = t.getAttribute('data-aba'); X.lembrar('fin_aba', aba); desenhar(); carregar(); window.scrollTo(0, 0); return; }
  per = t.getAttribute('data-per'); X.lembrar('fin_per', per);
  if (per === 'pers' && !pers) { var m = X.mes(X.hoje(), 0); pers = [m[0], X.hoje()]; }
  desenhar(); carregar();
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id;
  if (id === 'fEmp') { emp = ev.target.value; X.lembrar('fin_emp', emp); desenhar(); carregar(); }
  if (id === 'pDe' || id === 'pAte') {
    var de = X.val('pDe'), ate = X.val('pAte'); if (!de || !ate) return;
    pers = [de, ate]; X.lembrar('fin_pers', JSON.stringify(pers)); desenhar(); carregar();
  }
});
document.getElementById('btVoltar').innerHTML = F.ic('seta');
document.getElementById('btAt').innerHTML = F.ic('atualizar');
document.getElementById('btVoltar').onclick = function () { try { App.voltar(); } catch (e) { history.back(); } };
document.getElementById('btAt').onclick = function () { carregar(true); };
document.getElementById('btImg').innerHTML = F.ic('imagem'); document.getElementById('btImg').onclick = imagem;
window.temaMudou = function (t) { document.documentElement.setAttribute('data-tema', t); };
F.topoSombra();
desenhar(); carregar();
