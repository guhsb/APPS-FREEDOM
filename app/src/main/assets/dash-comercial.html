<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="dash.css"><script>try{document.documentElement.setAttribute('data-tema',((window.App&&App.tema&&App.tema())||localStorage.getItem('tema'))==='escuro'?'escuro':'claro')}catch(e){document.documentElement.setAttribute('data-tema','claro')}</script>
<style>.perfil{display:inline-flex;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--rosa-s);color:var(--tx-rosa);margin-left:6px;vertical-align:2px}</style>
</head><body class="dash">
<div class="topo">
  <button class="bt voltar" id="btVoltar" aria-label="Voltar"></button>
  <div class="tt"><h1 id="tit">Painel Comercial</h1><div class="st" id="sub">Carregando…</div></div>
  <button class="bt" id="btAt" aria-label="Atualizar"></button>
</div>
<div id="aviso"></div>
<div id="c"><div class="carregando"><i></i>Carregando o dashboard…</div></div>
<script src="base.js"></script>
<script src="dash.js"></script>
<script>
var me = null, P = null, d = null, aba = Dash.lembrar('com_aba') || 'resumo', periodo = 'mes', gestorSel = '', vendSel = '', filtroGer = '', carregandoAgora = false, pedido = 0;
var verTodos = {};
var X = Dash;

// filtros extras (iguais aos do site): período livre, vários gestores/vendedores, categoria, rede e situação do pedido
var FX = { ini: '', fim: '', ger: [], ven: [], cat: [], rede: [], st: [] };
function datas() {
  var h = X.hoje();
  if (periodo === 'pers') return [FX.ini || X.mes(h, 0)[0], FX.fim || h];
  return periodo === 'ant' ? X.mes(h, -1) : X.mes(h, 0);
}
function qlista(k, v) { return (v || []).map(function (x) { return '&' + k + '=' + encodeURIComponent(x); }).join(''); }
/** Parte extra do endereço; semRede = Faturamento (o site não manda rede nem situação ali). */
function fxExtra(semRede) {
  var f = '';
  if (P.tipo !== 'ven' && !vendSel && FX.ven.length && podeVend()) f += qlista('seller', FX.ven);
  f += qlista('category', FX.cat);
  if (!semRede) f += qlista('network', FX.rede) + qlista('order_status', FX.st);
  return f;
}
function permis(p) { return me && Array.isArray(me.permissions) && me.permissions.indexOf(p) >= 0; }
function podeVend() { return permis('filters:seller') || permis('filters:team_seller') || P.tipo !== 'ven'; }
function nFiltros() { return FX.ger.length + FX.ven.length + FX.cat.length + FX.rede.length + FX.st.length + (periodo === 'pers' ? 1 : 0); }
function fx(semRede) {
  var f = P.fx;
  if (P.tipo === 'dir' && FX.ger.length && !gestorSel) f = qlista('manager', FX.ger);
  if (P.tipo === 'dir' && gestorSel) f = '&manager=' + encodeURIComponent(gestorSel);
  if (vendSel) f = (P.tipo === 'ger' ? P.fx : '') + '&seller=' + encodeURIComponent(vendSel);
  return f + fxExtra(semRede);
}

var mostrado = '';   // de qual filtro é o que está na tela
function carregar(forcar) {
  if (carregandoAgora && !forcar) return;
  carregandoAgora = true; var meu = ++pedido;
  document.getElementById('btAt').classList.add('gira');
  var pr = me ? Promise.resolve(me) : X.get('/auth/me');
  pr.then(function (m) {
    me = m; P = X.perfil(m);
    var dt = datas(), q = '?start_date=' + dt[0] + '&end_date=' + dt[1] + fx();
    var chave = 'com|' + (m.login || m.email || m.display_name || '') + '|' + periodo + '|' + gestorSel + '|' + vendSel + '|' + JSON.stringify(FX);
    // 1) abre na hora com o que foi carregado da última vez (se for deste mesmo login e filtro)
    var salvo = X.cache(chave);
    if (salvo && salvo.d && mostrado !== chave) { d = salvo.d; mostrado = chave; desenhar(); faixaAtualizando(salvo.t); }
    else if (mostrado !== chave) { d = null; document.getElementById('c').innerHTML = X.carregando('Carregando o dashboard…'); }
    var novo = { ini: dt[0], fim: dt[1], o: null, c: {}, cl: {}, pr: {}, nw: {}, se: {}, dv: {}, mg: {} };
    var velho = salvo && salvo.d ? salvo.d : {};
    // 2) o principal (Resumo) primeiro; clientes, produtos e redes chegam logo depois sem segurar a tela
    var principal = Promise.all([X.get('/dashboard/overview' + q), X.opc('/dashboard/overview/charts' + q), X.opc('/dashboard/sellers' + q),
      P.tipo === 'dir' && !vendSel && !gestorSel ? X.opc('/dashboard/managers?start_date=' + dt[0] + '&end_date=' + dt[1]) : Promise.resolve({})]);
    var extras = Promise.all([X.opc('/dashboard/clients' + q), X.opc('/dashboard/products' + q), X.opc('/dashboard/networks' + q), X.opc('/dashboard/daily-evolution' + q)]);
    return principal.then(function (r) {
      if (meu !== pedido) return;
      novo.o = r[0]; novo.c = r[1]; novo.se = r[2]; novo.mg = r[3];
      ['cl', 'pr', 'nw', 'dv'].forEach(function (k) { novo[k] = velho[k] || {}; });   // até chegar o novo, usa o guardado
      d = novo; mostrado = chave; document.getElementById('aviso').innerHTML = ''; desenhar(); faixaAtualizando(null, true);
      return extras.then(function (e) {
        if (meu !== pedido) return;
        novo.cl = e[0]; novo.pr = e[1]; novo.nw = e[2]; novo.dv = e[3]; novo.extrasOk = true; novo.hora = Date.now();
        d = novo; desenharMantendo(); faixaAtualizando(null);
        X.cache(chave, novo);
      });
    });
  }).catch(function (e) {
    if (meu !== pedido) return;
    document.getElementById('aviso').innerHTML = X.erro(e.message || 'Não consegui carregar');
    if (!d) document.getElementById('c').innerHTML = '';
  }).then(function () { if (meu === pedido) { carregandoAgora = false; document.getElementById('btAt').classList.remove('gira'); } });
}
/** Redesenha sem perder a rolagem nem o que estiver digitando. */
function desenharMantendo() {
  var y = window.scrollY, el = document.activeElement, id = el && el.id, pos = el && el.selectionStart;
  desenhar(); window.scrollTo(0, y);
  if (id) { var n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }
}
/** Texto do topo: "atualizando…" enquanto busca; nada quando os números já são os de agora. */
function faixaAtualizando(t, quaseLa) {
  var s = document.getElementById('sub'); if (!s || !P) return;
  var b = d && d.o ? (d.o.last_movement_date || '') : '';
  s.innerHTML = F.esc(P.nome) + (b ? ' · base de <b>' + X.dm(b) + '</b>' : '') + (t ? ' · atualizando…' : quaseLa ? ' · carregando detalhes…' : '');
}

// ---------- contas ----------
function base() {
  var o = d.o, fat = F.n(o.sales_revenue), meta = F.n(o.revenue_target), du = F.n(o.business_days_total), dec = F.n(o.business_days_elapsed), rest = F.n(o.business_days_remaining);
  var idealP = du > 0 ? Math.min(1, dec / du) : 0, falta = Math.max(0, meta - fat);
  return { fat: fat, meta: meta, p: meta > 0 ? fat / meta : 0, idealP: idealP, rest: rest, falta: falta, porDia: rest > 0 ? falta / rest : 0, du: du, dec: dec,
    ped: F.n(o.order_count), cli: F.n(o.customer_count), tm: F.n(o.average_order_value), pos: F.n(o.positive_customer_count), metaPos: F.n(o.positive_customer_target),
    proj: F.n(o.projected_revenue), baseDia: o.last_movement_date || '' };
}
function vendedores() {
  var b = base(), l = Array.isArray(d.se.sellers) ? d.se.sellers : [];
  return l.filter(Boolean).map(function (x) { var v = F.n(x.revenue), m = F.n(x.meta_revenue);
    return { chave: x.seller_name, nome: X.nome(x.seller_name), gestor: X.nome(x.manager_name), v: v, m: m, p: m > 0 ? v / m : 0, cli: F.n(x.client_count), ped: F.n(x.order_count), pace: x.pace_status, idealP: b.idealP }; });
}
function ordenar(l) { return l.slice().sort(function (a, b) { if ((a.m > 0) !== (b.m > 0)) return a.m > 0 ? -1 : 1; return a.m > 0 ? b.p - a.p : b.v - a.v; }); }

// ---------- telas ----------
function desenhar() {
  var b = base();
  document.getElementById('tit').innerHTML = 'Painel Comercial<span class="perfil">' + P.papel + '</span>';
  document.getElementById('sub').innerHTML = F.esc(P.nome) + (b.baseDia ? ' · base de <b>' + X.dm(b.baseDia) + '</b>' : '') + (d.hora ? ' · ' + F.hhmm(d.hora) : '');
  var tabs = P.tipo === 'dir' ? [['resumo', 'Resumo'], ['vendedores', 'Vendedores'], ['clientes', 'Clientes'], ['produtos', 'Produtos'], ['redes', 'Redes']]
    : P.tipo === 'ger' ? [['resumo', 'Resumo'], ['vendedores', 'Equipe'], ['clientes', 'Clientes'], ['produtos', 'Produtos'], ['redes', 'Redes']]
    : [['resumo', 'Resumo'], ['clientes', 'Clientes'], ['produtos', 'Produtos'], ['redes', 'Redes']];
  var perms = (me && Array.isArray(me.permissions)) ? me.permissions : [];
  if (perms.indexOf('managers:view') >= 0 || perms.indexOf('managers:view_own') >= 0) tabs.splice(P.tipo === 'ven' ? 1 : 2, 0, ['gestores', 'Gestores']);
  tabs = tabs.concat([['evolucao', 'Evolução'], ['faturamento', 'Faturamento'], ['bonif', 'Bonificações']]);
  if (vendSel && aba === 'vendedores') aba = 'resumo';
  if (!tabs.some(function (t) { return t[0] === aba; })) aba = 'resumo';
  var h = X.abas(vendSel ? tabs.filter(function (t) { return t[0] !== 'vendedores'; }) : tabs, aba);
  h += '<div class="filtro"><span><b>Período</b><select id="selPer"><option value="mes"' + (periodo === 'mes' ? ' selected' : '') + '>Este mês</option>' +
    '<option value="ant"' + (periodo === 'ant' ? ' selected' : '') + '>Mês passado</option><option value="pers"' + (periodo === 'pers' ? ' selected' : '') + '>Escolher datas…</option></select></span>';
  if (P.tipo === 'dir') {
    var gs = gestores();
    h += '<span><b>Equipe</b><select id="selGer"><option value="">Todos os gestores</option>' + gs.map(function (g) { return '<option value="' + F.esc(g) + '"' + (g === gestorSel ? ' selected' : '') + '>' + F.esc(X.nome(g)) + '</option>'; }).join('') + '</select></span>';
  } else h += '<span class="fix"><b>' + (P.tipo === 'ger' ? 'Equipe' : 'Vendedor') + '</b>' + (P.tipo === 'ger' ? 'Só a sua equipe' : 'Só os seus números') + '</span>';
  h += '</div>';
  if (periodo === 'pers') { var dt0 = datas(); h += '<div class="sub2"><input type="date" class="inp" id="fxIni" value="' + dt0[0] + '"' + (OPC.d && OPC.d.available_period ? ' min="' + OPC.d.available_period.minimum + '"' : '') + '><input type="date" class="inp" id="fxFim" value="' + dt0[1] + '"></div>'; }
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-2px 0 12px"><button class="btn cl mini" data-cx="filtros">' + F.ic('ajustes') + ' Filtros' + (nFiltros() ? ' (' + nFiltros() + ')' : '') + '</button>' +
    (nFiltros() ? '<button class="btn cl mini" data-cx="limpar">Limpar</button>' : '') +
    (RELAT[aba] ? '<button class="btn az mini" data-cx="excel" style="margin-left:auto">' + F.ic('baixar') + ' Exportar Excel</button>' : '') + '</div>';
  if (vendSel) h += '<div class="vendo">' + F.ic('olho') + '<span>Vendo só ' + F.esc(X.nome(vendSel)) + '</span><button id="btTodos">Ver todos</button></div>';
  if (aba === 'resumo') h += resumo(b);
  if (aba === 'vendedores') h += telaVendedores(b);
  if (aba === 'clientes') h += clientes();
  if (aba === 'produtos') h += produtos();
  if (aba === 'redes') h += redes();
  if (aba === 'gestores') h += telaGestores(b);
  if (aba === 'evolucao') h += telaEvolucao();
  if (aba === 'faturamento') h += telaFaturamento();
  if (aba === 'bonif') h += telaBonif();
  var c = document.getElementById('c'); c.innerHTML = h;
  X.ligarGraficos(c);
}
var _gestores = null;
function gestores() {
  if (!_gestores && d.mg && Array.isArray(d.mg.managers)) _gestores = d.mg.managers.map(function (m) { return m.manager_name; }).filter(Boolean);
  if (!_gestores) { var s = {}; vendedores().forEach(function (v) { var g = (d.se.sellers || []).filter(function (x) { return x.seller_name === v.chave; })[0]; if (g && g.manager_name && !/múltiplos/i.test(g.manager_name)) s[g.manager_name] = 1; }); return Object.keys(s); }
  return _gestores;
}

function resumo(b) {
  var h = '', quem = vendSel ? X.nome(vendSel) + ' faturou' : P.tipo === 'ven' ? 'Você faturou' : P.tipo === 'ger' ? 'Sua equipe faturou' : gestorSel ? 'Equipe ' + X.nome(gestorSel) + ' faturou' : 'Faturado';
  var noMes = periodo === 'mes' ? ' no mês' : periodo === 'pers' ? ' no período' : ' no mês passado', acima = b.p >= b.idealP;
  h += '<div class="card hero"><div class="lb">' + quem + noMes + '</div><div class="v">' + X.brl0(b.fat) + '</div>';
  if (b.meta > 0) {
    h += '<div class="s"><b>' + X.p0(b.p) + '</b> da meta de ' + X.k(b.meta) + '</div>' +
      '<div class="barra"><i style="width:' + Math.min(100, b.p * 100) + '%"></i>' + (periodo === 'mes' ? '<u style="left:' + b.idealP * 100 + '%"></u>' : '') + '</div>' +
      '<div class="leg"><span>0</span>' + (periodo === 'mes' ? '<span>▲ ideal hoje ' + X.p0(b.idealP) + '</span>' : '<span></span>') + '<span>' + X.k(b.meta) + '</span></div><div class="chips">';
    if (b.p >= 1) h += '<span class="chip ok">★ Meta batida</span>';
    else if (periodo === 'mes') h += '<span class="chip ' + (acima ? 'ok' : 'la') + '">' + (acima ? '▲ ' : '▼ ') + Math.abs(Math.round((b.p - b.idealP) * 100)) + ' pts ' + (acima ? 'acima' : 'abaixo') + ' do ideal</span>';
    if (periodo === 'mes' && b.proj > 0) h += '<span class="chip vi">Projeção ' + X.k(b.proj) + ' (' + X.p0(b.proj / b.meta) + ')</span>';
    if (periodo === 'mes' && b.falta > 0 && b.rest > 0) h += '<span class="chip az">Faltam ' + X.k(b.falta) + ' · ' + X.k(b.porDia) + '/dia</span>';
    h += '</div>';
  } else h += '<div class="s">' + X.int(b.ped) + ' pedidos · sem meta cadastrada para este filtro</div>';
  h += '</div>';
  var daily = Array.isArray(d.c.daily) ? d.c.daily : [], diasVenda = daily.filter(function (x) { return F.n(x.revenue) > 0; }).length;
  var abc = Array.isArray(d.cl.abc_summary) ? d.cl.abc_summary : [];
  h += X.k4([['Pedidos', X.int(b.ped), diasVenda + ' dias com venda'], ['Ticket médio', X.brl0(b.tm), 'por pedido'],
    ['Clientes', X.int(b.cli), abc.length ? abc.map(function (a) { return a.abc_class + ': ' + a.client_count; }).join(' · ') : 'no período'],
    ['Positivação', X.int(b.pos) + (b.metaPos > 0 ? ' <small style="font-size:13px;color:var(--tx3)">/ ' + X.int(b.metaPos) + '</small>' : ''),
      b.metaPos > 0 ? X.p0(b.pos / b.metaPos) + (periodo === 'mes' ? ' · ideal ' + X.p0(b.idealP) : '') : 'clientes',
      '', b.metaPos > 0 ? '<div class="mini"><i style="width:' + Math.min(100, b.pos / b.metaPos * 100) + '%"></i>' + (periodo === 'mes' ? '<u style="left:' + b.idealP * 100 + '%"></u>' : '') + '</div>' : '']]);
  h += ritmo(b, daily);
  h += X.atencao(insights(b, daily));
  var fam = Array.isArray(d.c.families) ? d.c.families.slice(0, 5) : [];
  if (fam.length) h += X.card('Top famílias', 'Participação no faturamento', X.barras(fam.map(function (f) { return [X.cap(f.name), f.revenue, f.share_percentage]; })));
  if (P.tipo === 'dir' && !gestorSel && !vendSel && d.mg && Array.isArray(d.mg.managers)) {
    var com = d.mg.managers.filter(function (m) { return F.n(m.meta_revenue) > 0; }), sem = d.mg.managers.length - com.length;
    if (com.length) h += X.card('Gestores', '% da meta · ideal hoje ' + X.p0(b.idealP) + ' · toque para ver a equipe',
      com.sort(function (a, c) { return F.n(c.achievement_percentage) - F.n(a.achievement_percentage); }).map(function (m) {
        return X.meta(X.nome(m.manager_name), X.k(m.realized_revenue) + ' de ' + X.k(m.meta_revenue), F.n(m.achievement_percentage) / 100, b.idealP, 'g:' + m.manager_name);
      }).join('') + (sem > 0 ? '<div class="cs" style="margin:8px 0 0">+ ' + sem + ' sem meta definida</div>' : ''));
  }
  if ((P.tipo === 'ger' || gestorSel) && !vendSel) {
    var vs = ordenar(vendedores());
    if (vs.length) h += X.card(P.tipo === 'ger' ? 'Minha equipe' : 'Equipe', '% da meta · ideal hoje ' + X.p0(b.idealP) + ' · toque para abrir',
      vs.map(function (v) { return X.meta(v.nome, X.k(v.v) + (v.m > 0 ? ' de ' + X.k(v.m) : '') + ' · ' + v.cli + ' clientes', v.p, b.idealP, 'v:' + v.chave, v.m <= 0); }).join(''));
  }
  return h;
}

function ritmo(b, daily) {
  if (!daily.length || b.meta <= 0) return '';
  var dias = X.dias(d.ini, d.fim), n = dias.length, porDia = {};
  daily.forEach(function (x) { porDia[String(x.sale_date).slice(0, 10)] = x; });
  var hoje = X.hoje(), real = [], ideal = [], acum = 0, idl = 0, bd = 0, dicas = [], ultimo = -1;
  dias.forEach(function (dia, i) {
    var x = porDia[dia]; if (X.util(dia)) bd++;
    idl = x && x.ideal_cumulative_revenue != null ? F.n(x.ideal_cumulative_revenue) : (b.du > 0 ? b.meta * bd / b.du : 0);
    ideal.push([i, idl]);
    if (dia <= hoje && (!b.baseDia || dia <= b.baseDia || x)) { acum = x && x.cumulative_revenue != null ? F.n(x.cumulative_revenue) : acum + F.n(x && x.revenue); real.push([i, acum]); ultimo = i; }
    var dif = acum - idl;
    dicas.push(i <= ultimo ? '<b>' + X.dm(dia) + '</b> · vendido ' + X.k(x ? x.revenue : 0) + '<br>acumulado ' + X.k(acum) + ' · ideal ' + X.k(idl) + '<br><b style="color:' + (dif >= 0 ? '#7ee2b8' : '#ffb27a') + '">' + (dif >= 0 ? '+' : '−') + X.k(Math.abs(dif)) + '</b> do ideal'
      : '<b>' + X.dm(dia) + '</b> · ideal ' + X.k(idl));
  });
  var series = [{ pts: ideal, cor: 'var(--tx3)', tracejado: '5 4', fino: true }];
  if (periodo === 'mes' && b.proj > 0 && ultimo >= 0 && ultimo < n - 1) series.push({ pts: [[ultimo, acum], [n - 1, b.proj]], cor: 'var(--rosa)', tracejado: '3 4', opac: .7 });
  series.push({ pts: real, cor: 'var(--rosa)', fimPonto: true });
  var meio = Math.floor(n / 2);
  var g = X.linhas('ritmo', series, n, [[0, X.dm(dias[0])], [meio, X.dm(dias[meio])], [n - 1, X.dm(dias[n - 1])]], Math.max(b.meta, b.proj, acum), [[b.meta, 'meta ' + X.k(b.meta)]], dicas);
  return X.card('Ritmo do mês', 'Acumulado × caminho ideal até a meta · toque para ver o dia', g +
    '<div class="lg"><span><i style="border-color:var(--rosa)"></i>Realizado</span><span><i style="border-color:var(--tx3);border-top-style:dashed"></i>Ideal</span>' +
    (periodo === 'mes' && b.proj > 0 ? '<span><i style="border-color:var(--rosa);border-top-style:dotted"></i>Projeção</span>' : '') + '</div>');
}

function insights(b, daily) {
  var r = [];
  // vendedor (ou um vendedor escolhido): dias úteis sem venda
  if ((P.tipo === 'ven' || vendSel) && periodo === 'mes' && daily.length) {
    var ult = '', ateDia = b.baseDia || X.hoje();
    daily.forEach(function (x) { if (F.n(x.revenue) > 0) ult = String(x.sale_date).slice(0, 10); });
    if (ult) { var sem = X.dias(ult, ateDia).slice(1).filter(X.util).length;
      if (sem >= 2) r.push(X.ins('laranja', '📅', sem + ' dias úteis sem venda', 'Última venda em ' + X.dm(ult) + ' · ' + X.k((daily.filter(function (x) { return String(x.sale_date).slice(0, 10) === ult; })[0] || {}).revenue))); }
  }
  // metade × metade
  var sm = d.dv && d.dv.summary;
  if (sm && sm.half_variation_percentage != null && Math.abs(F.n(sm.half_variation_percentage)) >= 15 && F.n(sm.first_half_revenue) > 0) {
    var v = F.n(sm.half_variation_percentage);
    r.push(X.ins(v < 0 ? 'laranja' : 'verde', v < 0 ? '↘' : '↗', '2ª metade ' + Math.abs(Math.round(v)) + '% ' + (v < 0 ? 'abaixo' : 'acima') + ' da 1ª',
      X.k(sm.first_half_revenue) + ' na 1ª metade contra ' + X.k(sm.second_half_revenue) + ' na 2ª'));
  }
  // clientes que pararam
  var ra = Array.isArray(d.cl.reduced_activity) ? d.cl.reduced_activity.filter(function (x) { return F.n(x.second_half_revenue) <= 0; }) : [];
  if (ra.length) r.push(X.ins('rosa', '!', ra.length + (ra.length === 1 ? ' cliente parou' : ' clientes pararam') + ' de comprar',
    ra.slice(0, 3).map(function (x) { return X.cap(x.client_name).slice(0, 26); }).join(', ') + (ra.length > 3 ? ' e mais ' + (ra.length - 3) : '') + ' · veja em Clientes'));
  // quem está abaixo do ritmo
  if (periodo === 'mes') {
    if (P.tipo === 'dir' && !gestorSel && !vendSel && d.mg && Array.isArray(d.mg.managers)) {

        '<span>' + X.int(v.order_count) + ' pedidos · ' + X.int(v.client_count) + ' clientes · ' + X.int(v.quantity) + ' un · ticket ' + (v.average_ticket != null ? F.brl(v.average_ticket) : '—') + ' · ' + F.pct(v.revenue_percentage) + '</span>' +
        (r[0] ? '<span class="bdg ' + r[1] + '">' + r[0] + '</span>' : '') + '</div><div class="v">' + F.brl(v.revenue) + '</div></div>';

}

// ---------- telas que buscam na hora (Gestores, Evolução, Faturamento, Bonificações, Infalíveis) ----------
var EX = {};
function qAtual() { return '?start_date=' + d.ini + '&end_date=' + d.fim + fx(); }
function extra(nome, url) {
  var k = mostrado + '|' + nome, e = EX[k];
  if (!e) { EX[k] = e = {}; X.get(url).then(function (j) { e.d = j || {}; }).catch(function (er) { e.e = er.message || 'Não consegui carregar'; }).then(desenharMantendo); }
  return e;
}
function blocoEx(e, fn) { if (e.e) return '<div class="aviso">' + F.ic('alerta') + '<span>' + F.esc(e.e) + '</span></div>'; if (!e.d) return X.carregando(); return fn(e.d); }
var RITMO = { above_pace: ['▲ Acima do ritmo', 'ok'], on_pace: ['● No ritmo', 'ok'], below_pace: ['▼ Abaixo do ritmo', 'ba'], no_target: ['Sem meta', 'sm'] };
var buscaGer = '';
function telaGestores(b) {
  var e = extra('ger', '/dashboard/managers' + qAtual());
  return blocoEx(e, function (g) {
    var cal = g.calendar || {}, ideal = F.n(cal.ideal_pace_percentage) / 100, h = '';
    var ls = (Array.isArray(g.managers) ? g.managers : []).filter(function (m) { return !buscaGer || X.nome(m.manager_name).toLowerCase().indexOf(buscaGer.toLowerCase()) >= 0; });
    var com = ls.filter(function (m) { return m.pace_status !== 'no_target'; }), no = com.filter(function (m) { return m.pace_status === 'above_pace' || m.pace_status === 'on_pace'; }).length;
    h += X.k4([['No ritmo', no, 'de ' + com.length + ' com meta', 'pos'], ['Abaixo do ritmo', com.length - no, cal.ideal_pace_percentage != null ? 'ideal hoje ' + Math.round(F.n(cal.ideal_pace_percentage)) + '%' : '', 'lar'],
      ['Dias úteis', X.int(cal.elapsed_business_days) + ' de ' + X.int(cal.total_business_days), X.int(cal.remaining_business_days) + ' restantes'],
      ['Total', g.total ? X.k(g.total.realized_revenue) : '—', g.total && g.total.meta_revenue ? 'de ' + X.k(g.total.meta_revenue) + ' · ' + Math.round(F.n(g.total.achievement_percentage)) + '%' : '']]);
    h += '<input class="busca" id="buscaGer" placeholder="Buscar gestor..." value="' + F.esc(buscaGer) + '">';
    h += X.card('Ritmo de meta por gestor', '% da meta × ritmo ideal' + (P.tipo === 'dir' ? ' · toque para ver a equipe' : ''), ls.map(function (m) {
      var r = RITMO[m.pace_status] || ['', 'sm'], semMeta = m.pace_status === 'no_target';
      return X.meta(X.nome(m.manager_name), X.k(m.realized_revenue) + (m.meta_revenue ? ' de ' + X.k(m.meta_revenue) : '') + (m.remaining_to_target_revenue && F.n(m.remaining_to_target_revenue) > 0 ? ' · faltam ' + X.k(m.remaining_to_target_revenue) : ''),
        F.n(m.achievement_percentage) / 100, F.n(m.ideal_pace_percentage != null ? m.ideal_pace_percentage : cal.ideal_pace_percentage) / 100, P.tipo === 'dir' ? 'g:' + m.manager_name : '', semMeta) +
        '<div class="det" style="margin-top:-2px">Positivação <b>' + X.int(m.positivity_realized) + (m.positivity_target != null ? ' / ' + X.int(m.positivity_target) : '') + '</b>' + (m.positivity_percentage != null ? ' (' + Math.round(F.n(m.positivity_percentage)) + '%)' : '') +
        (m.projected_revenue != null ? ' · Projeção <b>' + X.k(m.projected_revenue) + '</b>' : '') + ' · Bonificação <b>' + X.k(m.bonus_value) + '</b> · <span class="st2 ' + r[1] + '">' + r[0] + '</span></div>';
    }).join('') || '<div class="vazio">Nenhum gestor no filtro.</div>');
    return h;
  });
}
function telaEvolucao() {
  var dv = d.dv || {}, sm = dv.summary;
  if (!sm) return d.extrasOk ? '<div class="vazio">Sem vendas no período para mostrar a evolução.</div>' : X.carregando('Carregando a evolução…');
  var h = '', v = sm.half_variation_percentage;
  h += X.k4([['Faturamento no período', X.k(sm.period_revenue), X.int(sm.sales_day_count) + ' dias com venda'], ['Média diária', X.k(sm.daily_average), 'por dia com venda'],
    ['Variação 1ª → 2ª metade', v == null ? 'Não comparável' : (F.n(v) >= 0 ? '+' : '') + Math.round(F.n(v)) + '%', X.k(sm.first_half_revenue) + ' → ' + X.k(sm.second_half_revenue), v == null ? '' : F.n(v) >= 0 ? 'pos' : 'neg']]);
  var porDia = {}; (dv.daily_revenue || []).forEach(function (x) { porDia[String(x.sale_date).slice(0, 10)] = F.n(x.revenue); });
  var dias = X.dias(d.ini, (X.hoje() < d.fim ? X.hoje() : d.fim)), vals = dias.map(function (x) { return porDia[x] || 0; });
  if (dias.length) h += X.card('Faturamento por dia', 'Dias sem movimento aparecem zerados', X.colunas(vals, function (i) { return i % 5 === 0 || i === dias.length - 1 ? X.dm(dias[i]) : ''; }, F.n(sm.daily_average), 'média ' + X.k(sm.daily_average), null, dias.map(function (x, i) { return '<b>' + F.dataBR(x) + '</b><br>' + F.brl(vals[i]); })));
  var wd = (dv.weekday_revenue || []).slice().sort(function (a, b) { return ((a.weekday_number + 6) % 7) - ((b.weekday_number + 6) % 7); });
  if (wd.length) h += X.card('Por dia da semana', 'Média por ocorrência', X.barras(wd.map(function (w) { return [w.weekday_label, w.average_revenue, null, X.int(w.occurrence_count) + 'x · total ' + X.k(w.revenue)]; }), 'var(--violeta)'));
  h += X.card('Primeira vs. segunda metade', '', X.barras([['1ª metade', sm.first_half_revenue], ['2ª metade', sm.second_half_revenue]], 'var(--azul)'));
  return h;
}
var verFat = {};
function telaFaturamento() {
  var e = extra('fat', '/dashboard/billing?start_date=' + d.ini + '&end_date=' + d.fim + fx(true));
  return blocoEx(e, function (f) {
    var sm = f.summary || {}, h = '';
    h += X.k4([['Faturamento líquido', X.k(sm.net_revenue), X.int(sm.movement_count) + ' movimentos'], ['Quantidade líquida', X.int(sm.net_quantity) + ' un', ''], ['Devoluções', X.k(sm.return_value), '', F.n(sm.return_value) ? 'neg' : ''],
      ['Custo médio ponderado', sm.weighted_average_cost != null ? F.brl(sm.weighted_average_cost) : '—', 'só quantidades positivas']]);
    var dl = (f.daily || []).slice().sort(function (a, b) { return a.movement_date < b.movement_date ? -1 : 1; });
    if (dl.length) h += X.card('Faturamento diário', 'Líquido por dia · devoluções e bonificação na lista', X.colunas(dl.map(function (x) { return F.n(x.net_revenue); }), function (i) { return i % 5 === 0 || i === dl.length - 1 ? X.dm(dl[i].movement_date) : ''; }, 0, '', null, dl.map(function (x) { return '<b>' + F.dataBR(x.movement_date) + '</b><br>Líquido ' + F.brl(x.net_revenue) + '<br>Devoluções ' + F.brl(x.return_value) + '<br>Bonificação ' + F.brl(x.bonus_value); })) +
      dl.slice(-5).reverse().map(function (x) { return '<div class="row"><span>' + F.dataBR(x.movement_date) + ' · dev. ' + X.k(x.return_value) + ' · bonif. ' + X.k(x.bonus_value) + '</span><b>' + X.k(x.net_revenue) + '</b></div>'; }).join(''));
    [['sellers', 'Faturamento por vendedor', 'var(--azul)'], ['families', 'Faturamento por família', 'var(--violeta)'], ['products', 'Produtos faturados', 'var(--verde)']].forEach(function (g) {
      var l = f[g[0]] || []; if (!l.length) return; var n = verFat[g[0]] ? 60 : 8;
      h += X.card(g[1], 'Faturamento líquido e % do total', X.barras(l.slice(0, n).map(function (x) { return [x.name, x.net_revenue, x.percentage, X.int(x.net_quantity) + ' un']; }), g[2]) +
        (l.length > n ? '<button class="mais" data-fmais="' + g[0] + '">Ver mais (' + l.length + ')</button>' : ''));
    });
    return h;
  });
}
function telaBonif() {
  var e = extra('bon', '/dashboard/bonuses?start_date=' + d.ini + '&end_date=' + d.fim + fx());
  return blocoEx(e, function (bn) {
    var sm = bn.summary || {}, h = '';
    h += X.k4([['Total bonificado', X.k(sm.total_bonified), ''], ['% sobre o faturamento', sm.bonus_revenue_percentage != null ? F.pct(sm.bonus_revenue_percentage) : '—', 'de ' + X.k(sm.revenue_total)],
      ['Vendedores bonificados', X.int(sm.bonified_sellers), 'com valor positivo']]);
    var vs = bn.by_seller || [], cs = bn.by_category || [];
    if (vs.length) h += X.card('Bonificação por vendedor', 'Top ' + Math.min(12, vs.length), X.barras(vs.slice(0, 12).map(function (x) { return [X.nome(x.seller_name), x.bonus_amount, x.percentage]; }), 'var(--laranja)'));
    if (cs.length) h += X.card('Bonificação por categoria', 'Top ' + Math.min(12, cs.length), X.barras(cs.slice(0, 12).map(function (x) { return [x.category_name, x.bonus_amount, x.percentage]; }), 'var(--laranja)'));
    if (!vs.length && !cs.length) h += '<div class="vazio">Nenhuma bonificação no período.</div>';

}
function telaInfal() {
  var e = extra('inf', '/dashboard/products/infallibles');
  return blocoEx(e, function (f) {
    var it = f.items || [];
    return X.card('Programa de produtos foco (Infalíveis)', 'Usa a base oficial completa e não responde aos filtros da página', it.map(function (x) {
      return '<div class="row"><span><b style="color:var(--tx3);display:inline-block;width:24px">' + x.rank + '</b>' + F.esc(x.focus_name) + '<br><span style="font-size:11.5px;color:var(--tx3);padding-left:24px">' + X.int(x.positive_count) + ' positivações · ' + F.pct(x.revenue_percentage) + ' do total</span></span><b>' + X.k(x.revenue) + '</b></div>';
    }).join('') || '<div class="vazio">Nenhum infalível cadastrado.</div>');
  });
}

// ---------- toques ----------
document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-aba],[data-sub],[data-psub],[data-fmais],[data-v],[data-mais],#btTodos') : null; if (!t) return;
  if (t.hasAttribute('data-psub')) { subProd = t.getAttribute('data-psub'); desenhar(); return; }
  if (t.hasAttribute('data-fmais')) { verFat[t.getAttribute('data-fmais')] = true; desenharMantendo(); return; }
  if (t.hasAttribute('data-aba')) { aba = t.getAttribute('data-aba'); X.lembrar('com_aba', aba); desenhar(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute('data-sub')) { filtroGer = t.getAttribute('data-sub'); desenhar(); return; }
  if (t.hasAttribute('data-mais')) { var mm = t.getAttribute('data-mais'); if (mm === 'cli') { nCli += 60; desenharMantendo(); return; } verTodos[mm] = true; desenharMantendo(); return; }
  if (t.id === 'btTodos') { vendSel = ''; carregar(true); return; }
  var v = t.getAttribute('data-v');
  if (v.indexOf('v:') === 0) { vendSel = v.slice(2); aba = 'resumo'; verTodos = {}; window.scrollTo(0, 0); carregar(true); }
  else if (v.indexOf('g:') === 0) { gestorSel = v.slice(2); _gestores = _gestores; aba = 'resumo'; verTodos = {}; window.scrollTo(0, 0); carregar(true); }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'selPer') { periodo = ev.target.value; verTodos = {}; carregar(true); }
  if (ev.target.id === 'selGer') { gestorSel = ev.target.value; vendSel = ''; filtroGer = ''; verTodos = {}; carregar(true); }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'buscaCli') { buscaCli = ev.target.value; nCli = 30; desenharMantendo(); return; }
  if (ev.target.id === 'buscaVen') { buscaVen = ev.target.value; desenharMantendo(); return; }
  if (ev.target.id === 'buscaGer') { buscaGer = ev.target.value; desenharMantendo(); return; }
  if (ev.target.id === 'buscaProd') { buscaProd = ev.target.value; var pos = ev.target.selectionStart; desenhar(); var el = document.getElementById('buscaProd'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } } }
});
document.getElementById('btVoltar').innerHTML = F.ic('seta');
document.getElementById('btAt').innerHTML = F.ic('atualizar');
document.getElementById('btVoltar').onclick = function () {
  if (vendSel) { vendSel = ''; carregar(true); return; }
  if (history.length > 1) history.back(); else location.href = 'painel-comercial.html';
};
document.getElementById('btAt').onclick = function () { EX = {}; carregar(true); };
window.temaMudou = function (t) { document.documentElement.setAttribute('data-tema', t); };
F.topoSombra();
carregar();
</script>
