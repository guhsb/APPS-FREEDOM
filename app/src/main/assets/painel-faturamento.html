<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="base.css">
<style>
.hero{text-align:left}
.hero .big{font-size:38px;margin:10px 0 8px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px}
.dist{display:flex;height:8px;border-radius:8px;overflow:hidden;background:var(--sf3);margin:16px 0 2px;gap:2px}
.dist i{display:block;height:100%}
.tp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--ln)}
.tp:first-child{border-top:0}
.tp .cor{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}
.tp .nm{flex:1;min-width:0}
.tp .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .nm span{display:block;font-size:12px;color:var(--tx3);margin-top:2px}
.tp .vl{text-align:right;flex:none}
.tp .vl b{display:block;font-size:14.5px;white-space:nowrap}
.tp .vl span{display:block;font-size:12px;color:var(--tx3);margin-top:2px}
.mes{display:flex;align-items:center;gap:12px}
.mes .ico{width:40px;height:40px;border-radius:12px;background:var(--azul-s);color:var(--azul);display:flex;align-items:center;justify-content:center;flex:none}
.mes .tx{flex:1;min-width:0}
.mes b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;margin-top:2px}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.duas .card{margin:0;padding:14px;position:relative;overflow:hidden}
.duas .card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.duas .card span{display:block;font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duas .card b{display:block;font-size:18px;margin-top:6px;white-space:nowrap}
@media (max-width:360px){.hero .big{font-size:32px}.duas .card b{font-size:15px}}
</style></head><body>
<div id="conteudo"></div>
<script>var PAINEL_ID = 'faturamento';</script>
<script src="base.js"></script>
<script>
var CORES = { V: '#1fbf8f', C: '#8b6cf0', '1': '#4f7cff', B: '#f0a53a', P: '#2bb673', O: '#e5484d', D: '#3b82f6',
              Q: '#f59e0b', M: '#10b981', T: '#f97316', '5': '#a855f7', '7': '#ef4444', '6': '#7c3aed', A: '#60a5fa' };
Base.iniciar(function (d, e) {
  var dia = d.dia || {}, mes = d.mes || {}, tipos = (dia.tipos || []).slice(), tot = F.n(dia.valor);
  tipos.sort(function (a, b) { return F.n(b.valor) - F.n(a.valor); });
  var nPed = Math.round(F.n(dia.pedidos));
  var h = '<div class="card hero"><div class="rot">Faturamento do dia</div>' +
    '<div class="big"><small>R$</small>' + F.num(dia.valor) + '</div>' +
    '<div class="meta"><span class="pill">' + F.esc(F.dataBR(dia.data) || 'hoje') + '</span>' +
    '<span class="pill">' + nPed + (nPed === 1 ? ' pedido' : ' pedidos') + '</span>' +
    (tipos.length ? '<span class="pill">' + tipos.length + (tipos.length === 1 ? ' tipo' : ' tipos') + '</span>' : '') + '</div>';
  if (tot > 0 && tipos.length) {
    h += '<div class="dist">' + tipos.map(function (t) {
      return '<i style="flex:' + Math.max(0.5, F.n(t.valor) / tot * 100) + ';background:' + (CORES[t.codigo] || '#8b93a7') + '"></i>';
    }).join('') + '</div>';
  }
  h += '</div>';

  h += '<div class="sec"><h2>Por tipo de pedido</h2><span>' + (tipos.length || '') + '</span></div>';
  if (!tipos.length) h += '<div class="vazio">Nenhum pedido faturado hoje até agora.</div>';
  else h += '<div class="lista">' + tipos.map(function (t) {
    var p = tot ? F.pct(F.n(t.valor) / tot * 100) : '';
    var np = Math.round(F.n(t.pedidos));
    return '<div class="tp" style="--c:' + (CORES[t.codigo] || '#8b93a7') + '"><i class="cor"></i>' +
      '<div class="nm"><b>' + F.esc(t.nome) + '</b><span>' + np + (np === 1 ? ' pedido' : ' pedidos') + '</span></div>' +
      '<div class="vl"><b>' + F.brl(t.valor) + '</b><span>' + p + '</span></div></div>';
  }).join('') + '</div>';

  h += '<div class="sec"><h2>Mês e pendências</h2><span></span></div>' +
    '<div class="card mes"><div class="ico">' + F.ic('grafico') + '</div><div class="tx"><div class="rot">Total de ' + F.esc(mes.nome || 'mês') + '</div>' +
    '<b>' + F.brl(mes.valor) + '</b></div></div>' +
    '<div class="duas"><div class="card" style="--c:var(--laranja)"><span>Standby</span><b>' + F.brl(d.standby) + '</b></div>' +
    '<div class="card" style="--c:var(--violeta)"><span>PEND faturável (equipe)</span><b>' + F.brl(d.pend) + '</b></div></div>' +
    '<div class="rod">Atualiza sozinho a cada 15 minutos · toque em ↻ para atualizar agora</div>';
  document.getElementById('conteudo').innerHTML = h;
});
</script>
</body></html>
