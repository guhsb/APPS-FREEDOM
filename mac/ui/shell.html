var ABAS = [['helpdesk','Helpdesk'],['comercial','Comercial'],['logistica','Logística'],['admin','Admin'],['painel','Painel'],['site','Site']];
function desenhar(s) {
  var nav = document.getElementById('nav');
  nav.style.display = s.logado ? 'block' : 'none';
  nav.innerHTML = ABAS.filter(function (a) { return s.abas.indexOf(a[0]) >= 0; }).map(function (a) {
    var on = s.aba === a[0];
    return '<button class="b' + (on ? ' on' : '') + '" data-a="' + a[0] + '"><div class="p">' + IC[a[0]][on ? 'a' : 'n'] + '</div><div class="l">' + a[1] + '</div>' +

  }).join('');
  var ch = document.getElementById('chips');
  var mostrar = s.logado && s.aba === 'painel' && s.paineis.length > 1;
  ch.style.display = mostrar ? 'flex' : 'none';
  ch.innerHTML = mostrar ? s.paineis.map(function (p) { return '<button class="' + (p.id === s.painel ? 'on' : '') + '" data-p="' + p.id + '">' + p.nome + '</button>'; }).join('') : '';
}
document.getElementById('nav').onclick = function (e) { var b = e.target.closest('[data-a]'); if (b) Barra.escolher(b.getAttribute('data-a')); };
document.getElementById('chips').onclick = function (e) { var b = e.target.closest('[data-p]'); if (b) Barra.painel(b.getAttribute('data-p')); };
Barra.aoMudar(function (s) { if (s.tema) document.documentElement.setAttribute('data-tema', s.tema); desenhar(s); });
