<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(420px 320px at 50% 12%,rgba(232,75,138,.16),transparent 70%),#0a0c12;color:#f2f4f8;
font:16px system-ui,-apple-system,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;text-align:center}
img{height:64px;margin-bottom:10px}
h1{font-size:20px;margin:0 0 4px}
p.s{color:#8b93a7;font-size:13px;margin:0 0 24px;line-height:1.4}
label{display:block;text-align:left;color:#8b93a7;font-size:12px;margin:14px 0 6px;letter-spacing:.04em}
input{width:100%;background:#12151f;border:1px solid #232838;border-radius:12px;color:#f2f4f8;font-size:16px;padding:14px;outline:none}
input:focus{border-color:#e84b8a}
.senha{position:relative}.senha button{position:absolute;right:6px;top:6px;bottom:6px;background:none;border:0;color:#8b93a7;font-size:13px;padding:0 10px}
button.entrar{width:100%;margin-top:22px;background:#e84b8a;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:700;padding:15px}
button.entrar:disabled{opacity:.6}
.erro{color:#f0a53a;font-size:14px;margin-top:14px;min-height:20px}
.rod{color:#5d6578;font-size:12px;margin-top:22px;line-height:1.5}
</style></head><body>
<div class="box">
  <img src="logo.png" alt="Freedom">
  <h1 id="nome">Freedom</h1>
  <p class="s">Entre com o mesmo e-mail e senha do site<br>relatorios.cbfreedom.com.br</p>
  <form id="f" autocomplete="on">
    <label for="email">E-MAIL</label>
    <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="senha">SENHA</label>
    <div class="senha"><input id="senha" type="password" autocomplete="current-password" required>
      <button type="button" id="ver">mostrar</button></div>
    <button class="entrar" id="btn" type="submit">Entrar</button>
  </form>
  <div class="erro" id="erro"></div>
  <div class="rod">O login fica guardado só neste celular, com a senha criptografada.<br>Cada pessoa usa o próprio acesso.</div>
</div>
<script>
try { document.getElementById('nome').textContent = App.nome(); } catch (e) {}
var btn = document.getElementById('btn'), erro = document.getElementById('erro');
document.getElementById('ver').onclick = function () {
  var s = document.getElementById('senha'); var mostrar = s.type === 'password';
  s.type = mostrar ? 'text' : 'password'; this.textContent = mostrar ? 'esconder' : 'mostrar';
};
document.getElementById('f').onsubmit = function (ev) {
  ev.preventDefault();
  var e = document.getElementById('email').value.trim(), s = document.getElementById('senha').value;
  if (!e || !s) { erro.textContent = 'Preencha o e-mail e a senha.'; return; }
  erro.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
  try { App.entrar(e, s); } catch (x) { erroLogin('não consegui falar com o app'); }
};
function erroLogin(msg) { btn.disabled = false; btn.textContent = 'Entrar'; erro.textContent = 'Não entrou: ' + msg; }
</script>
</body></html>
