<script>

F.IC.x = '<path d="M6 6l12 12M18 6L6 18"/>';
var STATUS = { OPEN: ['Aberto', 'var(--azul)', 'rgba(79,124,255,.15)'], IN_PROGRESS: ['Em andamento', 'var(--violeta)', 'rgba(139,108,240,.16)'],
  REOPENED: ['Reaberto', 'var(--azul)', 'rgba(79,124,255,.15)'], WAITING: ['Aguardando', 'var(--laranja)', 'rgba(240,165,58,.15)'],

  RESOLVED: ['Resolvido', 'var(--verde)', 'rgba(31,191,143,.15)'], CLOSED: ['Fechado', 'var(--tx3)', 'var(--sf3)'],
  CANCELED: ['Cancelado', 'var(--tx3)', 'var(--sf3)'], CANCELLED: ['Cancelado', 'var(--tx3)', 'var(--sf3)'] };
var PRIO = { LOW: ['Baixa', '#6b7489'], MEDIUM: ['Média', '#4f7cff'], HIGH: ['Alta', 'var(--laranja)'], URGENT: ['Urgente', '#ef4444'] };
var SLA = { NOT_CONFIGURED: 'Sem SLA', ON_TRACK: 'No prazo', AT_RISK: 'Atenção', BREACHED: 'Vencido', MET: 'Cumprido' };

function stLabel(s) { return (STATUS[s] || [s || '—'])[0]; }
function prLabel(s) { return (PRIO[s] || [s || '—'])[0]; }
function data(s) {
  if (!s) return null;
  s = String(s).replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1');
  if (!/[zZ]|[+-]\d\d:?\d\d$/.test(s)) s += 'Z';
  var d = new Date(s); return isNaN(d) ? null : d;
}
function hora(s) { var d = data(s); return d ? F.hhmm(d.getTime()) : ''; }
function diaTxt(d) {
  var h = new Date(), on = new Date(h.getTime() - 86400000);
  if (d.toDateString() === h.toDateString()) return 'Hoje';
  if (d.toDateString() === on.toDateString()) return 'Ontem';
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
