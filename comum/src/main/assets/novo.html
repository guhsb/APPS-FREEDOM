<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="base.css"><script>try{document.documentElement.setAttribute('data-tema',((window.App&&App.tema&&App.tema())||localStorage.getItem('tema'))==='escuro'?'escuro':'claro')}catch(e){document.documentElement.setAttribute('data-tema','claro')}</script>
<style>
.topo .bt.voltar{border:0;background:transparent;width:34px;margin-left:-8px}
.topo .bt.voltar svg.ic{transform:rotate(180deg);width:24px;height:24px}
.form{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px}
.campo{margin-bottom:16px}
.campo:last-child{margin-bottom:0}
.campo > label{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin:0 2px 7px}
.campo > label em{font-style:normal;color:var(--rosa)}
.campo select,.campo input,.campo textarea{width:100%;background:var(--sf2);border:1px solid var(--ln2);border-radius:12px;color:var(--tx);font:inherit;font-size:15px;padding:12px;outline:none}
.campo textarea{min-height:140px;resize:vertical;line-height:1.4}
.campo select:focus,.campo input:focus,.campo textarea:focus{border-color:var(--rosa)}
.dica{font-size:12px;color:var(--tx3);margin:6px 2px 0;line-height:1.4}
.prios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prios button{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ln);background:var(--sf2);color:var(--tx2);border-radius:999px;padding:9px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.prios button i{width:8px;height:8px;border-radius:50%;flex:none}
.prios button.on{border-color:var(--tx);background:var(--tx);color:var(--sf)}
@media (min-width:600px){.prios{display:flex;flex-wrap:wrap}.prios button{padding:8px 18px}}
.enviar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:0;border-radius:12px;padding:15px;background:var(--rosa);color:#fff;
  font:inherit;font-size:16px;font-weight:700;box-shadow:0 8px 22px rgba(232,75,138,.28)}
.enviar:disabled{opacity:.6}
.cont{float:right;font-weight:500;color:var(--tx3)}
/* anexos */
.btAnexo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--ln2);background:var(--sf2);color:var(--tx2);
  border-radius:12px;padding:13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btAnexo:active,.btAnexo.sobre{border-color:var(--rosa);color:var(--rosa);background:var(--rosa-s)}
.btAnexo svg.ic{width:19px;height:19px}
.anexos{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.anx{display:flex;align-items:center;gap:10px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.anx .ic2{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--azul-s);color:var(--azul);font:800 9.5px/1 Roboto,sans-serif;text-transform:uppercase;overflow:hidden}
.anx .ic2 img{width:100%;height:100%;object-fit:cover}
.anx .nm{flex:1;min-width:0}.anx .nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anx .nm span{font-size:11.5px;color:var(--tx3)}
.anx .st{font-size:11.5px;font-weight:700;color:var(--tx3);flex:none}
.anx .st.ok{color:var(--verde)}.anx .st.erro{color:var(--vermelho)}
.anx button{flex:none;border:0;background:transparent;color:var(--tx3);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
/* formulário no estilo do app: linhas com ícone (igual Configurações) e seções com título em maiúsculas */
.fLista .fItem{align-items:flex-start;padding:12px 14px}.fLista .fItem:active{background:none}
.fLista .fItem .ico{margin-top:20px}
.fLista .fItem label{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:700;color:var(--tx2);margin:0 2px 6px;letter-spacing:.01em}
.fLista .fItem label em,.sec h2 em.ob{font-style:normal;color:var(--rosa)}
.fLista .fItem label .op{font-weight:500;color:var(--tx3)}
.fLista select,.fLista input,.fCard textarea{width:100%;box-sizing:border-box;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;color:var(--tx);font:inherit;font-size:15px;padding:11px 12px;outline:none}
.fLista select:focus,.fLista input:focus,.fCard textarea:focus{border-color:var(--rosa);box-shadow:0 0 0 3px var(--rosa-s)}
.fCard{padding:12px}
.fCard textarea{min-height:140px;resize:vertical;line-height:1.45;display:block}
.sec span#cDesc,.sec span#cAnx{font-size:12px;color:var(--tx3)}
.prios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (min-width:600px){.prios{display:flex;flex-wrap:wrap}.prios button{padding:8px 18px}}
.enviar{margin-top:18px}
html.largo body{max-width:880px!important}
/* celular: o botão fica sempre acima da barra de baixo (gruda nela quando a tela é maior) */
html.barraFlutuante .enviar{position:sticky;bottom:84px;z-index:5}
html.barraFlutuante.tecladoAberto .enviar{bottom:8px}
/* celular: mais compacto (sem os ícones, campos e espaços menores) */
@media (max-width:600px){
  .sec{margin:14px 2px 7px}.sec h2{font-size:12px}
  .fLista .fItem{padding:9px 10px;gap:0}.fLista .fItem .ico{display:none}
  .fLista .fItem label{font-size:11.5px;margin:0 2px 4px}
  .fLista select,.fLista input,.fCard textarea{font-size:14.5px;padding:9px 10px;border-radius:10px}
  .fLista .dica{margin-top:4px;font-size:11.5px}
  .fCard{padding:9px}.fCard textarea{min-height:96px}
  .prios button{padding:7px 2px;font-size:12.5px}
  .btAnexo{padding:10px;font-size:13.5px}
  .enviar{margin-top:12px;padding:13px;font-size:15px}
  .topo{padding-bottom:6px}
}
</style></head><body>
<div class="topo">
  <button class="bt voltar" id="btVoltar" aria-label="Voltar"></button>
  <div class="tt"><h1>Abrir chamado</h1><div class="st">Vai para o setor escolhido no Helpdesk</div></div>
</div>
<div id="aviso"></div>
<div id="conteudo" data-solto><div class="carregando"><i></i>Carregando setores…</div></div>
<script src="base.js"></script>
<script>
var setores = [], prio = 'MEDIUM', enviando = false, anexos = [], seqAnexo = 0, esperaAnexo = {};
var TIPOS = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', txt: 'text/plain', xls: 'application/vnd.ms-excel',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', doc: 'application/msword',
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
var MAX = 10 * 1024 * 1024, MAX_ARQ = 10;
function podeAnexar() { try { return typeof App.enviarAnexoNovo === 'function' || (window.App && 'enviarAnexoNovo' in App); } catch (e) { return false; } }
function tamanho(n) { return n >= 1048576 ? F.um(n / 1048576) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
document.getElementById('btVoltar').innerHTML = F.ic('seta');
document.getElementById('btVoltar').onclick = function () { try { App.voltar(); } catch (e) { history.back(); } };

function linhaCampo(id, icone, cor, rotulo, controle, extra) {
  return '<div class="item fItem" id="' + id + '"' + (extra || '') + '><div class="ico" style="background:var(--' + cor + '-s);color:var(--' + cor + ')">' + F.ic(icone) + '</div>' +
    '<div class="tx">' + rotulo + controle + '</div></div>';
}
function montar() {
  var h = '<div class="sec"><h2>Para onde vai</h2></div><div class="lista fLista">' +
    linhaCampo('campoSetor', 'pessoa', 'azul', '<label for="setor">Setor <em>*</em></label>',
      '<select id="setor"><option value="">Escolha o setor…</option>' + setores.map(function (q) { return '<option value="' + q.id + '">' + F.esc(q.name) + '</option>'; }).join('') + '</select><div class="dica" id="descSetor"></div>') +
    linhaCampo('campoTit', 'msg', 'violeta', '<label for="titulo">Título <em>*</em><span class="cont" id="cTit"></span></label>', '<input id="titulo" maxlength="160" placeholder="Resumo do problema ou pedido">') +
    linhaCampo('campoTipo', 'lista', 'violeta', '<label for="tipo">Título <em>*</em></label>', '<select id="tipo"><option value="">Selecione o título…</option></select><div class="dica" id="dTipo"></div>', ' style="display:none"') +
    linhaCampo('campoResp', 'pessoa', 'verde', '<label for="resp">Responsável <span class="op">opcional</span></label>', '<select id="resp"><option value="">Deixar para o setor</option></select>', ' style="display:none"') +
    '</div>' +
    '<div class="sec"><h2>Prioridade</h2></div><div class="prios" id="prios">' + Object.keys(F.PRIO).map(function (k) {
      return '<button type="button" data-p="' + k + '" class="' + (k === prio ? 'on' : '') + '"><i style="background:' + F.PRIO[k][1] + '"></i>' + F.PRIO[k][0] + '</button>'; }).join('') + '</div>' +
    '<div class="sec"><h2>Descrição <em class="ob">*</em></h2><span id="cDesc"></span></div>' +
    '<div class="card fCard"><textarea id="desc" maxlength="10000" placeholder="Explique o que aconteceu: número do pedido, nota, cliente, desde quando…"></textarea></div>' +
    (podeAnexar() ? '<div class="sec"><h2>Anexos</h2><span id="cAnx"></span></div><div class="card fCard"><div class="anexos" id="anexos"></div>' +
      '<button type="button" class="btAnexo" id="btAnexo">' + F.ic('clipe') + (temArrastar() ? 'Arraste aqui ou clique para anexar' : 'Anexar arquivo ou foto') + '</button>' +
      '<input type="file" id="arq" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.xls,.xlsx,.doc,.docx,application/pdf,image/png,image/jpeg,text/plain" style="display:none">' +
      '<div class="dica">PDF, imagem, texto, Excel ou Word · até 10 MB cada' + (temArrastar() ? ' · ou cole um print com Ctrl+V' : '') + '</div></div>' : '') +
    '<button class="enviar" id="btEnviar">' + F.ic('mais2') + 'Abrir chamado</button>' +
    (podeAnexar() ? '' : '<div class="rod">Depois de abrir, dá para anexar arquivos na tela do chamado</div>');
  document.getElementById('conteudo').innerHTML = h;
  var sel = document.getElementById('setor');
  sel.onchange = function () {
    var q = setores.filter(function (x) { return String(x.id) === sel.value; })[0];
    document.getElementById('descSetor').textContent = q && q.description ? q.description : '';
    carregarResponsaveis(sel.value);
    carregarTipos(q);
  };
  document.getElementById('prios').onclick = function (ev) {
    var b = ev.target.closest('[data-p]'); if (!b) return;
    prio = b.getAttribute('data-p');
    Array.prototype.forEach.call(document.querySelectorAll('#prios button'), function (x) { x.classList.toggle('on', x === b); });
  };
  var dsc = document.getElementById('desc'); dsc.oninput = function () { document.getElementById('cDesc').textContent = dsc.value.length > 40 ? dsc.value.length + ' letras' : ''; };
  var tit = document.getElementById('titulo');
  tit.oninput = function () { document.getElementById('cTit').textContent = tit.value.length ? tit.value.length + '/160' : ''; };
  document.getElementById('btEnviar').onclick = enviar;
  var arq = document.getElementById('arq');
  if (arq) {
    document.getElementById('btAnexo').onclick = function () { if (!enviando) arq.click(); };
    arq.onchange = function () { adicionar(arq.files); arq.value = ''; };
    // computador: arrastar arquivos para a tela
    document.addEventListener('dragover', function (ev) { if (enviando) return; ev.preventDefault(); document.getElementById('btAnexo').classList.add('sobre'); });
    document.addEventListener('dragleave', function (ev) { if (!ev.relatedTarget) document.getElementById('btAnexo').classList.remove('sobre'); });
    // print copiado (Win+Shift+S, PrintScreen…): Ctrl+V anexa a imagem
    F.aoColarImagem(function (arqs) { if (enviando) return; adicionar(arqs); F.toast(arqs.length > 1 ? arqs.length + ' prints anexados' : 'Print anexado'); });
    document.addEventListener('drop', function (ev) { ev.preventDefault(); document.getElementById('btAnexo').classList.remove('sobre'); if (!enviando && ev.dataTransfer) adicionar(ev.dataTransfer.files); });
  }
}
function temArrastar() { var p = F.plataforma(); return p !== 'android' && p !== ''; }

function adicionar(lista) {
  var ruins = [];
  Array.prototype.forEach.call(lista || [], function (f) {
    var ext = String(f.name || '').split('.').pop().toLowerCase();
    if (!TIPOS[ext]) { ruins.push(f.name + ' (tipo não aceito)'); return; }
    if (f.size > MAX) { ruins.push(f.name + ' (passa de 10 MB)'); return; }
    if (anexos.length >= MAX_ARQ) { ruins.push(f.name + ' (máximo ' + MAX_ARQ + ' arquivos)'); return; }
    if (anexos.some(function (a) { return a.f.name === f.name && a.f.size === f.size; })) return;
    anexos.push({ f: f, ext: ext, prev: /^image\//.test(f.type) ? URL.createObjectURL(f) : '', st: '' });
  });
  if (ruins.length) F.toast('Não deu para anexar: ' + ruins.join(', '));
  desenharAnexos();
}

function desenharAnexos() {
  var el = document.getElementById('anexos'); if (!el) return;
  el.innerHTML = anexos.map(function (a, i) {
    return '<div class="anx"><span class="ic2">' + (a.prev ? '<img src="' + a.prev + '">' : F.esc(a.ext)) + '</span>' +
      '<span class="nm"><b>' + F.esc(a.f.name) + '</b><span>' + tamanho(a.f.size) + '</span></span>' +
      (a.st ? '<span class="st ' + (a.st === 'Enviado' ? 'ok' : a.st === 'Falhou' ? 'erro' : '') + '">' + a.st + '</span>' :
        '<button type="button" data-i="' + i + '" aria-label="Tirar">×</button>') + '</div>';
  }).join('');
  document.getElementById('cAnx').textContent = anexos.length ? anexos.length + (anexos.length === 1 ? ' arquivo' : ' arquivos') : '';
  el.onclick = function (ev) { var b = ev.target.closest('[data-i]'); if (!b || enviando) return; var a = anexos.splice(Number(b.getAttribute('data-i')), 1)[0]; if (a && a.prev) URL.revokeObjectURL(a.prev); desenharAnexos(); };
}

function base64(f) {
  return new Promise(function (ok, erro) {
    var r = new FileReader();
    r.onload = function () { var s = String(r.result); ok(s.slice(s.indexOf(',') + 1)); };
    r.onerror = function () { erro(new Error('não consegui ler o arquivo')); };
    r.readAsDataURL(f);
  });
}
window.novoAnexo = function (seq, ok, msg) { var f = esperaAnexo[seq]; delete esperaAnexo[seq]; if (f) f({ ok: ok, msg: msg }); };

/** Depois do chamado criado: manda os anexos um por um. */
function enviarAnexos(id) {
  var falhas = [], i = 0, b = document.getElementById('btEnviar');
  return new Promise(function (fim) {
    var prox = function () {
      if (i >= anexos.length) { fim(falhas); return; }
      var a = anexos[i++];
      a.st = 'Enviando…'; desenharAnexos();
      b.lastChild.textContent = 'Enviando anexo ' + i + ' de ' + anexos.length + '…';
      base64(a.f).then(function (b64) {
        return new Promise(function (ok) {
          var seq = ++seqAnexo; esperaAnexo[seq] = ok;
          try { App.enviarAnexoNovo(seq, id, a.f.name, a.f.type || TIPOS[a.ext], b64); } catch (e) { delete esperaAnexo[seq]; ok({ ok: false, msg: 'O app não respondeu' }); }
        });
      }, function (e) { return { ok: false, msg: e.message }; }).then(function (r) {
        a.st = r.ok ? 'Enviado' : 'Falhou'; desenharAnexos();
        if (!r.ok) falhas.push(a.f.name + ': ' + (r.msg || 'não foi'));
        prox();
      });
    };
    prox();
  });
}

/** Título igual ao site: se o setor tem tipos de solicitação cadastrados, o título é escolhido na lista (não digitado). */
var tiposDe = {};   // setor -> tipos ativos (carregados do site)
function tiposObrig() {
  var q = setores.filter(function (x) { return String(x.id) === document.getElementById('setor').value; })[0];
  return !!(q && (q.request_types_required || (tiposDe[q.id] || []).length));
}
function carregarTipos(q) {
  var sel = document.getElementById('tipo'), dica = document.getElementById('dTipo'), cTit = document.getElementById('campoTit'), cTipo = document.getElementById('campoTipo');
  var mostrarTipo = function (sim) { cTit.style.display = sim ? 'none' : ''; cTipo.style.display = sim ? '' : 'none'; };
  if (!q) { mostrarTipo(false); return; }
  var obr = !!q.request_types_required, id = String(q.id);
  dica.textContent = 'Escolha o título na lista, igual no site.';
  if (tiposDe[id]) { preencher(tiposDe[id]); return; }
  mostrarTipo(true);
  sel.innerHTML = '<option value="">Carregando os títulos…</option>'; sel.disabled = true;
  function preencher(l) {
    if (l.length) {
      mostrarTipo(true);
      sel.innerHTML = '<option value="">Selecione o título…</option>' + l.map(function (t) { return '<option value="' + F.esc(t.id) + '">' + F.esc(t.name) + '</option>'; }).join('');
      sel.disabled = false; dica.textContent = 'Escolha o título na lista, igual no site.';
    } else if (obr) {
      mostrarTipo(true); sel.innerHTML = '<option value="">Nenhum tipo ativo</option>'; sel.disabled = true;
      dica.textContent = 'Este setor não possui tipos ativos. Solicite o cadastro ao responsável da área.';
    } else mostrarTipo(false);   // setor sem lista: o título é digitado
  }
  F.api('GET', '/helpdesk/queues/' + encodeURIComponent(id) + '/request-types').then(function (r) {
    var l = r.status === 200 ? (Array.isArray(r.json) ? r.json : (r.json && r.json.items) || []) : null;
    if (l) { l = l.filter(function (t) { return t.is_active !== false; }); tiposDe[id] = l; }
    if (document.getElementById('setor').value !== id) return;
    if (!l) {
      if (obr) { sel.innerHTML = '<option value="">Não carregou</option>'; dica.textContent = F.erroApi(r, 'Não foi possível carregar os tipos de solicitação.'); }
      else mostrarTipo(false);
      return;
    }
    preencher(l);
  });
}

function carregarResponsaveis(q) {
  var campo = document.getElementById('campoResp'), sel = document.getElementById('resp');
  campo.style.display = 'none'; sel.innerHTML = '<option value="">Deixar para o setor</option>';
  if (!q) return;
  F.api('GET', '/helpdesk/queues/' + encodeURIComponent(q) + '/assignees?limit=50').then(function (r) {
    if (document.getElementById('setor').value !== q) return;
    if (r.status === 200 && Array.isArray(r.json) && r.json.length) {
      sel.innerHTML += r.json.map(function (p) { return '<option value="' + p.id + '">' + F.esc(p.name) + '</option>'; }).join('');
      campo.style.display = '';
    }
  });
}

function enviar() {
  if (enviando) return;
  var q = document.getElementById('setor').value, t = document.getElementById('titulo').value.trim(),
    d = document.getElementById('desc').value.trim(), resp = document.getElementById('resp').value;
  var obr = q && tiposObrig(), tp = document.getElementById('tipo').value;
  if (!q || (obr ? !tp : t.length < 3) || d.length < 3) {
    F.toast(!q ? 'Escolha o setor.' : obr && !tp ? 'Escolha o título na lista.' : !obr && t.length < 3 ? 'Escreva o título (pelo menos 3 letras).' : 'Escreva a descrição (pelo menos 3 letras).');
    return;
  }
  enviando = true;
  var b = document.getElementById('btEnviar'); b.disabled = true; b.lastChild.textContent = 'Abrindo…';
  var corpo = { queue_id: Number(q), priority: prio, description: d };
  if (obr) corpo.request_type_id = Number(tp); else corpo.title = t;
  if (resp) corpo.assignee_user_id = Number(resp);
  F.api('POST', '/helpdesk/tickets', corpo).then(function (r) {
    if (r.status >= 200 && r.status < 300 && !r.fila && r.json && r.json.id && anexos.length) {
      // chamado criado: agora os anexos (o botão continua travado)
      var id = r.json.id, prot = r.json.protocol || '';
      enviarAnexos(id).then(function (falhas) {
        enviando = false;
        if (falhas.length) {
          var ba = document.getElementById('btAnexo'); if (ba) ba.style.display = 'none';
          b.disabled = false; b.lastChild.textContent = 'Ver o chamado';
          b.onclick = function () { location.replace('chamado.html#' + id); };
          document.getElementById('aviso').innerHTML = '<div class="aviso">' + F.ic('alerta') + '<span>Chamado ' + F.esc(prot) + ' aberto, mas ' +
            (falhas.length === 1 ? '1 anexo não foi' : falhas.length + ' anexos não foram') + ': ' + F.esc(falhas.join(' · ')) +
            '. Dá para anexar de novo na tela do chamado.</span></div>';
          window.scrollTo(0, 0);
          return;
        }
        F.toast('Chamado ' + prot + ' aberto com ' + anexos.length + (anexos.length === 1 ? ' anexo' : ' anexos'));
        location.replace('chamado.html#' + id);
      });
      return;
    }
    enviando = false; b.disabled = false; b.lastChild.textContent = 'Abrir chamado';
    if (r.fila) {
      document.getElementById('conteudo').innerHTML = '<div class="card" style="text-align:center;padding:26px 16px">' + F.ic('nuvem') +
        '<h3 style="margin:10px 0 6px">Chamado guardado</h3><p class="cinza" style="margin:0 0 16px">Você está sem internet. O chamado vai ser aberto sozinho assim que a conexão voltar, e você recebe um aviso.' +
        (anexos.length ? ' <b>Os anexos não foram guardados</b>: anexe na tela do chamado depois que ele abrir.' : '') + '</p>' +
        '<button class="enviar" onclick="try{App.voltar()}catch(e){history.back()}">Voltar</button></div>';
      return;
    }
    if (r.status >= 200 && r.status < 300 && r.json && r.json.id) {
      F.toast('Chamado ' + (r.json.protocol || '') + ' aberto');
      location.replace('chamado.html#' + r.json.id);      // abre o chamado criado (sem voltar para o formulário)
      return;
    }
    F.toast(F.erroApi(r, 'Não consegui abrir o chamado'));
  });
}

F.api('GET', '/helpdesk/queues').then(function (r) {
  if (r.status !== 200 || !Array.isArray(r.json)) {
    document.getElementById('conteudo').innerHTML = '';
    document.getElementById('aviso').innerHTML = '<div class="aviso">' + F.ic('alerta') + '<span>' + F.esc(F.erroApi(r, 'Não consegui carregar os setores')) +
      '</span><button onclick="location.reload()">Tentar</button></div>';
    return;
  }
  setores = r.json;
  montar();
});
F.topoSombra();
</script>
</body></html>
