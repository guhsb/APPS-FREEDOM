<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="base.css"><script>try{document.documentElement.setAttribute('data-tema',((window.App&&App.tema&&App.tema())||localStorage.getItem('tema'))==='escuro'?'escuro':'claro')}catch(e){document.documentElement.setAttribute('data-tema','claro')}</script>
<style>
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);background:var(--sf);border:1px solid var(--ln);
  border-radius:999px;padding:7px 12px;margin:2px 0 14px;width:max-content;max-width:100%}
.status i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px var(--verde-s);flex:none}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.off i{background:var(--tx3);box-shadow:none}.status.erro i{background:var(--laranja);box-shadow:0 0 0 3px var(--laranja-s)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 12px 11px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--ln2))}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi span{display:block;font-size:11.5px;color:var(--tx3);margin-top:4px;line-height:1.25}
.kpi.zero b{color:var(--tx3)}
.acoes{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:12px}
.acao{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);
  border-radius:14px;padding:12px;font:inherit;font-size:13px;font-weight:700;text-align:left}
.acao:active{background:var(--sf2)}
.acao svg.ic{width:20px;height:20px;color:var(--tx2)}
.acao.pri{background:var(--rosa);border-color:var(--rosa);color:#fff}.acao.pri svg.ic{color:#fff}
.acoes.duas{grid-template-columns:1fr 1fr}
.kpi[data-t]:active{background:var(--sf2)}
.cfg .item{align-items:center}
.cfgTopo{display:flex;align-items:center;gap:12px;width:100%;margin:22px 0 10px;padding:13px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);
  color:var(--tx);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--sombra)}
.cfgTopo .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sf3);color:var(--tx2)}
.cfgTopo .ico svg.ic{width:18px;height:18px}
.cfgTopo .tx{flex:1;min-width:0}.cfgTopo b{display:block;font-size:14px}.cfgTopo em{display:block;font-style:normal;font-size:12.5px;color:var(--tx3);margin-top:2px}
.cfgTopo .seta{color:var(--tx3);transition:transform .2s}.cfgTopo.on .seta{transform:rotate(180deg)}
.cfg .item .tx b{font-size:14px;font-weight:600}
.cfg .item p{-webkit-line-clamp:3}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw s{position:absolute;inset:0;background:var(--ln2);border-radius:28px;transition:.2s}
.sw s:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+s{background:var(--rosa)}.sw input:checked+s:before{transform:translateX(18px)}
select{background:var(--sf2);color:var(--tx);border:1px solid var(--ln2);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;flex:none}
.cfg .perigo b{color:var(--tx-vermelho)}
.badge.voce{background:var(--sf3);color:var(--tx2);font-size:10px;padding:2px 7px}
.item.meu{opacity:.78}
.dashbt{display:flex;align-items:center;gap:12px;padding:13px 14px;margin:0 0 12px;border:1.5px solid var(--violeta);border-radius:16px;background:linear-gradient(90deg,var(--violeta-s),var(--sf));cursor:pointer;color:var(--tx);text-decoration:none;width:100%;font:inherit;text-align:left}
.dashbt .q{width:40px;height:40px;border-radius:12px;background:var(--violeta);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.dashbt .q svg.ic{width:21px;height:21px}
.dashbt .tx{flex:1;min-width:0}.dashbt .tx b{font-size:15px;display:block}.dashbt .tx span{font-size:12.5px;color:var(--tx2)}
.dashbt .seta{color:var(--violeta);font-size:22px;line-height:1}
</style></head><body>
<div class="topo"><img src="logo.png" alt="Freedom"><div class="tt"><h1>Helpdesk</h1><div class="st" id="sub"></div></div>
  <button class="bt" id="btAt" aria-label="Verificar agora"></button></div>
<div id="conteudo"><div class="carregando"><i></i>Carregando…</div></div>
<script src="base.js"></script>
<script>
var STATUS = { OPEN: ['Aberto', 'var(--azul)', 'rgba(79,124,255,.15)'], IN_PROGRESS: ['Em andamento', 'var(--violeta)', 'rgba(139,108,240,.16)'],
  WAITING: ['Aguardando', 'var(--laranja)', 'rgba(240,165,58,.15)'], RESOLVED: ['Resolvido', 'var(--verde)', 'rgba(31,191,143,.15)'], CLOSED: ['Fechado', 'var(--tx3)', 'var(--sf3)'],
  REOPENED: ['Reaberto', 'var(--azul)', 'rgba(79,124,255,.15)'], WAITING_SUPPLIER: ['Aguard. fornecedor', 'var(--laranja)', 'rgba(240,165,58,.15)'],
  PENDING_APPROVAL: ['Aguard. aprovação', 'var(--verde)', 'rgba(31,191,143,.15)'] };
var PRIO = { LOW: '#6b7489', MEDIUM: '#4f7cff', NORMAL: '#4f7cff', HIGH: '#f0a53a', URGENT: '#ef4444', CRITICAL: '#ef4444' };
var PRIO_TXT = { LOW: 'Baixa', MEDIUM: 'Média', NORMAL: 'Normal', HIGH: 'Alta', URGENT: 'Urgente', CRITICAL: 'Crítica' };
var ultimo = '', diagAberto = false, cfgAberta = false;
// PC: as configurações abrem pelo nome do usuário (canto de cima), numa tela só delas (helpdesk.html?config=1)
var SO_CFG = /config=1/.test(location.search), PC = true;
PC = F.plataforma() !== 'android';
if (SO_CFG) { cfgAberta = true; document.querySelector('.topo h1').textContent = 'Configurações'; }   // configurações começam minimizadas
// trocar o tema remonta a tela no Android: volta com as configurações abertas
try { if (localStorage.getItem('cfgAbrir')) { cfgAberta = true; localStorage.removeItem('cfgAbrir'); } } catch (e) { }
document.getElementById('btAt').innerHTML = F.ic('atualizar');

function est() { try { return JSON.parse(App.helpdesk()); } catch (e) { return {}; } }
function quando(ms) {
  if (!ms) return '';
  var d = new Date(ms), h = new Date(), seg = Math.round((h - d) / 1000), min = Math.round(seg / 60);
  if (seg < 60) return 'agora';
  if (min < 60) return 'há ' + min + ' min';
  if (d.toDateString() === h.toDateString()) return F.hhmm(ms);
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + F.hhmm(ms);
}
function abrir(c) { try { App.abrirSite(c); } catch (e) {} }
function attr(t) { return F.esc(t).replace(/"/g, '&quot;'); }
function cfg(o) { try { App.configurarHelpdesk(JSON.stringify(o)); } catch (e) {} }
function rotInt(s) { return s < 60 ? s + ' s' : (s / 60) + ' min'; }
function primeiroNome(n) { n = String(n || '').trim(); if (!n) return ''; n = n.split(/\s+/)[0]; return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase(); }
// ícone e cor de cada aviso, pelo tipo de mudança
function tipoAviso(x) {
  var t = (x.titulo + ' ' + (x.linhas || []).join(' ')).toLowerCase();
  if (x.meu) return ['pessoa', 'var(--tx2)', 'var(--sf3)'];
  if (x.novo) return ['mais2', 'var(--rosa)', 'var(--rosa-s)'];
  if (t.indexOf('sla') >= 0) return ['alerta', 'var(--laranja)', 'var(--laranja-s)'];
  if (t.indexOf('anexou') >= 0) return ['clipe', 'var(--tx2)', 'var(--sf3)'];
  if (t.indexOf('status') >= 0 || t.indexOf('prioridade') >= 0 || t.indexOf('respons') >= 0 || t.indexOf('transferiu') >= 0) return ['troca', 'var(--violeta)', 'var(--violeta-s)'];
  return ['msg', 'var(--azul)', 'var(--azul-s)'];
}
function kpi(rot, v, cor, alerta, tela) {
  v = F.int(v); var z = v === '0';
  return '<div class="kpi' + (z ? ' zero' : '') + '"' + (tela ? ' data-t="' + tela + '"' : '') + ' style="--c:' + (z ? 'var(--ln2)' : cor) + '"><b' + (alerta && !z ? ' style="color:' + cor + '"' : '') + '>' + v + '</b><span>' + rot + '</span></div>';
}
function linhaCfg(icone, titulo, desc, controle) {
  return '<label class="item"><div class="ico" style="background:var(--sf3);color:var(--tx2)">' + F.ic(icone) + '</div>' +
    '<div class="tx"><div class="t1"><b>' + titulo + '</b></div>' + (desc ? '<p>' + desc + '</p>' : '') + '</div>' + (controle || '') + '</label>';
}
function linhaBotao(id, icone, titulo, desc, corFundo, cor, cls) {
  return '<div class="item ' + (cls || '') + '" id="' + id + '"><div class="ico" style="background:' + corFundo + ';color:' + cor + '">' + F.ic(icone) + '</div>' +
    '<div class="tx"><div class="t1"><b id="' + id + 'T">' + titulo + '</b></div><p>' + desc + '</p></div>' + (cls ? '' : '<span class="seta">' + F.ic('seta') + '</span>') + '</div>';
}
function chave(id, on) { return '<span class="sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><s></s></span>'; }

function render() {
  var e = est();
  var k = JSON.stringify(e) + Math.floor(Date.now() / 30000); try { k += localStorage.getItem('hd_semacesso') || ''; } catch (x) {}
  document.getElementById('btAt').classList.toggle('gira', !!e.verificando);
  if (k === ultimo) return;
  ultimo = k;
  var nome = primeiroNome(e.nome);
  document.getElementById('sub').innerHTML = (nome ? 'Olá, <b>' + F.esc(nome) + '</b> · ' : '') +
    (e.verificando ? 'verificando…' : e.ultima ? 'verificado ' + quando(e.ultima) : 'ainda não verificado');
  var h = '';
  var ap = e.app || {};
  if (!SO_CFG) {

  // situação dos avisos
  var ok = e.status === 'ok' || !e.status, cls = !e.ativo ? 'off' : ok ? '' : 'erro';
  var txt = !e.ativo ? 'Avisos desligados' : ok ? 'Avisos ligados · ' + (e.tempoReal ? 'tempo real' : 'econômico') + ' (' + rotInt(e.intervalo) + ')' : e.status;
  h += '<div class="status ' + cls + '"><i></i><span>' + F.esc(txt) + '</span></div>';

  if (ap.baixando)
    h += '<div class="aviso rosa">' + F.ic('atualizar') + '<span>Baixando a versão nova do app… <b>' + F.int(ap.progresso) + '%</b></span></div>';
  else if (ap.nova)
    h += '<div class="aviso rosa">' + F.ic('atualizar') + '<span>Nova versão do app disponível (<b>' + F.esc(ap.novaNome || F.int(ap.nova)) + '</b>).</span><button onclick="App.atualizarApp()">Atualizar</button></div>';
  if (ap.erro && !ap.baixando)
    h += '<div class="aviso">' + F.ic('alerta') + '<span>' + F.esc(ap.erro) + '</span><button onclick="App.atualizarPeloNavegador()">Baixar</button></div>';
  if (!e.ativo)
    h += '<div class="aviso rosa">' + F.ic('sino') + '<span>Os avisos do Helpdesk estão desligados neste celular.</span><button onclick="cfg({ativo:true})">Ligar</button></div>';
  if (e.ativo && !e.notifOk)
    h += '<div class="aviso">' + F.ic('sino') + '<span>As notificações do app estão bloqueadas.</span><button onclick="App.configurarNotificacoes()">Permitir</button></div>';
  else if (e.ativo && e.canalOk === false)
    h += '<div class="aviso">' + F.ic('som') + '<span>Os avisos estão <b>sem som</b> ou sem aparecer na tela.</span><button onclick="App.configurarSom()">Ajustar</button></div>';
  if (e.fila > 0)
    h += '<div class="aviso offline">' + F.ic('nuvem') + '<span>' + (e.fila === 1 ? '1 envio guardado' : e.fila + ' envios guardados') +
      ' sem internet. ' + (e.online === false ? 'Vai ser enviado quando a conexão voltar.' : 'Enviando…') + '</span></div>';
  if (e.ativo && !e.bateriaOk)
    h += '<div class="aviso">' + F.ic('bateria') + '<span>Libere a bateria para os avisos chegarem com a tela bloqueada.</span><button onclick="App.liberarBateria()">Liberar</button></div>';

  // números
  var r = e.resumo || {}, req = r.requester || {}, ws = r.workspace;
  h += '<div class="kpis">';
  if (ws) {
    h += kpi('Na fila', ws.open, 'var(--azul)', false, 'lista.html#fila') + kpi('Comigo', ws.assigned_to_me_active, 'var(--violeta)', false, 'lista.html#comigo') +
      kpi('Sem responsável', ws.unassigned_active, 'var(--laranja)', true, 'lista.html#fila&sem=1') + kpi('Meus chamados', req.active, 'var(--verde)', false, 'lista.html#meus') +
      kpi('SLA em risco', ws.sla_at_risk, 'var(--laranja)', true, 'lista.html#fila&sla=AT_RISK') + kpi('SLA estourado', ws.sla_breached, 'var(--vermelho)', true, 'lista.html#fila&sla=BREACHED');
  } else h += kpi('Meus chamados', req.active, 'var(--verde)', false, 'lista.html#meus');
  h += '</div>';

  // atalhos
  h += '<div class="acoes' + (ws ? '' : ' duas') + '"><button class="acao pri" data-t="novo.html">' + F.ic('mais2') + 'Abrir chamado</button>' +
    '<button class="acao" data-t="lista.html#meus">' + F.ic('lista') + 'Meus chamados</button>' +
    (ws ? '<button class="acao" data-t="lista.html#fila">' + F.ic('fone') + 'Atendimento</button>' : '') + '</div>';
  // dashboard do atendimento: só para quem atende algum setor (mesmo critério do botão Atendimento)
  if (ws) h += '<button class="dashbt" data-t="dash-helpdesk.html" style="margin-top:12px"><span class="q">' + F.ic('grafico') + '</span><span class="tx"><b>Dashboard do atendimento</b><span>' +
    F.int(ws.open) + ' na fila · ' + F.int(ws.assigned_to_me_active) + ' com você' + (F.n(ws.sla_breached) ? ' · ' + F.int(ws.sla_breached) + ' vencido' + (F.n(ws.sla_breached) > 1 ? 's' : '') : '') + '</span></span><span class="seta">›</span></button>';

  // últimas atualizações
  var feed = e.feed || [];
  h += '<div class="sec"><h2>Últimas atualizações</h2><span>' + (feed.length || '') + '</span></div>';
  if (!feed.length) h += '<div class="vazio">Nenhuma novidade por enquanto.<br>Quando um chamado mudar, o aviso aparece aqui e no celular.</div>';
  else {
    h += '<div class="lista">';
    feed.slice(0, 25).forEach(function (x) {
      var tp = tipoAviso(x), novo = !x.meu && x.t > (e.visto || 0);
      var linhas = (x.linhas || []).slice(0, 3).map(F.esc).join(' · ');
      h += '<div class="item' + (x.meu ? ' meu' : '') + '" data-c="' + attr(x.caminho || '/helpdesk') + '">' + (novo ? '<i class="ponto"></i>' : '') +
        '<div class="ico" style="background:' + tp[2] + ';color:' + tp[1] + '">' + F.ic(tp[0]) + '</div>' +
        '<div class="tx"><div class="t1"><b>' + F.esc(x.titulo) + '</b>' + (x.meu ? '<span class="badge voce">Você</span>' : '') +
        '<em>' + quando(x.t) + '</em></div><p>' + linhas + '</p></div></div>';
    });
    h += '</div>';
  }

  // chamados em aberto
  var semAc = []; try { semAc = JSON.parse(localStorage.getItem('hd_semacesso') || '[]'); } catch (x) {}
  var ab = (e.abertos || []).filter(function (t) { return semAc.indexOf(String(t.id)) < 0; });
  h += '<div class="sec"><h2>Chamados em aberto</h2><span>' + ab.length + '</span></div>';
  if (!ab.length) h += '<div class="vazio">' + (e.ultima ? 'Nenhum chamado em aberto que você acompanha.' : 'Buscando os chamados…') + '</div>';
  else {
    h += '<div class="lista">';
    ab.forEach(function (t) {
      var s = STATUS[t.status] || [t.status, '#8b93a7', 'var(--sf3)'];
      h += '<div class="item" data-c="/helpdesk/tickets/' + attr(t.id) + '">' +
        '<div class="ico" style="background:var(--sf2);border:1px solid var(--ln)"><i style="width:9px;height:9px;border-radius:50%;background:' + (PRIO[t.priority] || '#6b7489') + '"></i></div>' +
        '<div class="tx"><div class="t1"><b>' + F.esc(t.protocol) + '</b><span class="badge" style="color:' + s[1] + ';background:' + s[2] + '">' + F.esc(s[0]) + '</span></div>' +
        '<p>' + F.esc(t.title || '') + (PRIO_TXT[t.priority] ? ' · <span style="color:' + (PRIO[t.priority] || '') + '">' + PRIO_TXT[t.priority] + '</span>' : '') + '</p></div>' +
        '<span class="seta">' + F.ic('seta') + '</span></div>';
    });
    h += '</div>';
  }

  }
  // configurações
  var opts = [15, 30, 60, 120, 300, 600, 900, 1800].map(function (s) {
    return '<option value="' + s + '"' + (s === e.intervalo ? ' selected' : '') + '>' + rotInt(s) + '</option>';
  }).join('');
  if (!SO_CFG && !PC) h += '<button class="cfgTopo' + (cfgAberta ? ' on' : '') + '" id="btCfg"><span class="ico">' + F.ic('engrenagem') + '</span><span class="tx"><b>Configurações</b>' +
    '<em>Avisos, som, aparência, versão do app e login</em></span>' + F.ic('baixo', 'seta') + '</button>';
  if (cfgAberta) h += '<div class="lista cfg">' +
    linhaCfg('lua', 'Modo escuro', 'Desligado, o app fica claro, com as cores do site.', chave('cTema', F.tema() === 'escuro')) +
    linhaCfg('sino', 'Receber avisos', 'Novos chamados, respostas, status, prioridade, responsável e SLA', chave('cAtivo', e.ativo)) +
    linhaCfg('relogio', 'Modo tempo real', 'Aviso fixo na barra e verificação contínua. Desligado economiza bateria.', chave('cTR', e.tempoReal)) +
    linhaCfg('atualizar', 'Verificar a cada', 'Com a tela desligada, no máximo a cada 1 min', '<select id="cInt">' + opts + '</select>') +
    linhaCfg('pessoa', 'Avisar das minhas ações', 'Toca o celular também para o que você fez. Desligado, aparece só nesta lista.', chave('cMeu', e.minhasAcoes)) +
    linhaBotao('btTeste', 'sino', 'Testar notificação', 'Mostra um aviso de exemplo, com som', 'var(--rosa-s)', 'var(--rosa)') +
    linhaBotao('btSom', 'som', 'Som e estilo dos avisos', 'Som, vibração e tela de bloqueio', 'var(--sf3)', 'var(--tx2)') +
    (e.bateriaOk ? '' : linhaBotao('btBat', 'bateria', 'Uso em segundo plano', 'Liberar a bateria para os avisos não atrasarem', 'var(--sf3)', 'var(--tx2)')) +
    linhaBotao('btVersao', 'atualizar', 'Versão do app', 'Versão ' + F.esc(ap.atual || '?') + (ap.nova ? ' · <b style="color:var(--rosa)">nova versão ' + F.esc(ap.novaNome || F.int(ap.nova)) + ' disponível</b>' : ' · toque para procurar atualização'), 'var(--sf3)', 'var(--tx2)') +
    linhaBotao('btDiag', 'lista', 'Diagnóstico dos avisos', 'O que o app verificou e por que avisou (ou não). Ajuda a achar problemas.', 'var(--sf3)', 'var(--tx2)') +
    (diagAberto ? '<div class="item" style="display:block"><pre style="margin:0;white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;color:var(--tx2);max-height:320px;overflow:auto">' +
      ((e.diag || []).map(function (x) { return F.esc(quando(x.t) + ' · ' + x.x); }).join('\n') || 'Nada registrado ainda.') + '</pre>' +
      '<button class="b2" id="btCopiarDiag" style="margin-top:10px;width:100%;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;background:var(--sf3);color:var(--tx)">Copiar diagnóstico</button></div>' : '') +
    linhaBotao('sair', 'sair', 'Sair / trocar login', F.esc(e.email || ''), 'rgba(239,68,68,.12)', 'var(--tx-vermelho)', 'perigo') +
    '</div>';
  if (!SO_CFG) h += '<div class="rod">Toque num número, aviso ou chamado para abrir</div>';

  document.getElementById('conteudo').innerHTML = h;
  var bcfg = document.getElementById('btCfg'); if (bcfg) bcfg.onclick = function () { cfgAberta = !cfgAberta; ultimo = ''; render(); if (cfgAberta) { var b = document.getElementById('btCfg'); if (b.scrollIntoView) b.scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
  if (!cfgAberta) return;
  document.getElementById('cTema').onchange = function () { try { if (App.plataforma() === 'android') localStorage.setItem('cfgAbrir', '1'); } catch (e) { } F.definirTema(this.checked ? 'escuro' : 'claro'); };
  document.getElementById('cAtivo').onchange = function () { cfg({ ativo: this.checked }); };
  document.getElementById('cTR').onchange = function () { cfg({ tempoReal: this.checked }); };
  document.getElementById('cMeu').onchange = function () { cfg({ minhasAcoes: this.checked }); };
  document.getElementById('cInt').onchange = function () { cfg({ intervalo: parseInt(this.value, 10) }); };
  document.getElementById('btTeste').onclick = function () { try { App.testarNotificacao(); } catch (x) {} };
  document.getElementById('btSom').onclick = function () { try { App.configurarSom(); } catch (x) {} };
  document.getElementById('btDiag').onclick = function () { diagAberto = !diagAberto; ultimo = ''; render(); };
  var bcd = document.getElementById('btCopiarDiag'); if (bcd) bcd.onclick = function () { try { App.copiarDiagnostico(); } catch (x) {} };
  document.getElementById('btVersao').onclick = function () { try { App.atualizarApp(); } catch (x) {} };
  var bb = document.getElementById('btBat'); if (bb) bb.onclick = function () { try { App.liberarBateria(); } catch (x) {} };
  document.getElementById('sair').onclick = function () {
    if (this.dataset.ok) { try { App.sair(); } catch (x) {} return; }
    this.dataset.ok = '1'; document.getElementById('sairT').textContent = 'Toque de novo para confirmar';
  };
}

document.getElementById('btAt').onclick = function () { this.classList.add('gira'); try { App.verificarHelpdesk(); } catch (e) {} };
document.getElementById('conteudo').addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-t]') : null;
  if (t) { try { App.abrirTela(t.getAttribute('data-t')); } catch (e) {} return; }
  var el = ev.target.closest ? ev.target.closest('[data-c]') : null;
  if (el) abrir(el.getAttribute('data-c'));
});
window.recebidoHelpdesk = function () { ultimo = ''; render(); };
F.topoSombra();
render();
setInterval(render, 15000);
</script>
